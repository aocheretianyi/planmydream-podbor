<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Подборщик туров</title>
<style>
:root{
  --bg:#f6f3ee; --panel:#ffffff; --ink:#1f1d1a; --muted:#6f6a62; --line:#e6e0d6;
  --accent:#c2412d; --accent-soft:#fbe9e5; --ok:#2f7d4f; --ok-soft:#e5f3ea; --warn:#9a6a00; --warn-soft:#fbf1d9;
  --chip:#f1ece4; --chip-on:#1f1d1a; --chip-on-ink:#fff; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
header{display:flex;align-items:center;gap:16px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;white-space:nowrap}
header h1 span{color:var(--accent)}
#search{flex:1;max-width:420px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font:inherit}
#status{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
#reload{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px;font-size:12px}
main{display:grid;grid-template-columns:270px 300px 1fr;min-height:0}
.col{overflow:auto;min-height:0}
#filters{padding:14px 16px;border-right:1px solid var(--line);background:var(--panel)}
#results{padding:14px 12px;border-right:1px solid var(--line)}
#detail{padding:18px 22px 0}
.fgroup{margin-bottom:14px}
.fgroup h3{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:0;background:var(--chip);border-radius:999px;padding:4px 10px;font-size:13px}
.chip.on{background:var(--chip-on);color:var(--chip-on-ink)}
.chip small{opacity:.6;margin-left:3px}
.more{border:0;background:none;color:var(--accent);font-size:12px;padding:4px 2px}
#reset{width:100%;border:1px solid var(--line);background:none;border-radius:8px;padding:6px;color:var(--muted)}
.rhead{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:2px 4px 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow)}
.card.top{border-color:#e8b9ae}
.card.sel{outline:2px solid var(--accent);outline-offset:-1px}
.card .t{font-weight:600;font-size:13px;line-height:1.3}
.card .m{color:var(--muted);font-size:12px;margin-top:3px}
.card .why{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11px;border-radius:6px;padding:1px 6px;background:var(--ok-soft);color:var(--ok)}
.tag.no{background:var(--chip);color:var(--muted);text-decoration:line-through}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.compact .card{padding:8px 10px;box-shadow:none}
.empty{color:var(--muted);padding:30px 10px;text-align:center}
/* detail */
.d-top{display:flex;gap:16px;align-items:flex-start}
.d-title{font-size:20px;font-weight:700;line-height:1.25;margin:0}
.d-sub{color:var(--muted);margin-top:4px}
.price{margin-left:auto;text-align:right;white-space:nowrap}
.price b{font-size:22px}
.price s{color:var(--muted);margin-left:4px}
.d-sub a{color:var(--accent)}
.price div{color:var(--muted);font-size:12px}
.note{margin-top:8px;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:6px 10px;font-size:13px}
.dates{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.date{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 9px;font-size:13px}
.date small{color:var(--muted);margin-left:4px}
.date.match{border-color:var(--ok)}
.date.on{background:var(--chip-on);color:#fff;border-color:var(--chip-on)}
.date.on small{color:#ddd}
.date.full{opacity:.45;text-decoration:line-through;cursor:default}
.grid2{display:grid;grid-template-columns:1.05fr 1fr;gap:16px;margin-top:14px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.box h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
/* route */
.route{display:flex;flex-wrap:wrap;align-items:center;gap:4px 2px}
.city{background:var(--chip);border-radius:8px;padding:3px 8px;font-weight:600;font-size:13px}
.city.ext{background:none;border:1px dashed var(--line);font-weight:400;color:var(--muted)}
.leg{display:flex;flex-direction:column;align-items:center;min-width:64px;padding:0 4px;font-size:11px;color:var(--muted);line-height:1.2;text-align:center}
.leg .ic{font-size:15px}
.leg .ar{color:#bbb;letter-spacing:-2px}
.legsum{margin-top:10px;font-size:13px}
.legsum b{color:var(--accent)}
.leglist{margin:8px 0 0;padding:0;list-style:none;font-size:13px}
.leglist li{padding:3px 0;border-top:1px dashed var(--line)}
.leglist li:first-child{border-top:0}
.map{margin-top:10px;width:100%;border-radius:8px;cursor:zoom-in;display:block}
.auto{font-size:13px;margin:0;padding-left:16px}
.auto li{margin:3px 0}
.hint{color:var(--muted);font-size:12px;margin-top:6px}
/* script */
.tagline{font-size:15px;font-weight:600;margin:0 0 8px}
.ben{list-style:none;margin:0;padding:0}
.ben li{padding:5px 0;border-top:1px solid var(--line);font-size:13.5px}
.ben li:first-child{border-top:0}
.ben .p{font-weight:600}
.ben .g{color:var(--ok)}
.bridge{margin-top:8px;background:var(--accent-soft);border-radius:8px;padding:7px 10px;font-size:13.5px}
/* tabs */
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-top:16px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:7px 11px;border-radius:8px 8px 0 0;color:var(--muted)}
.tab.on{background:var(--panel);color:var(--ink);font-weight:600;border:1px solid var(--line);border-bottom-color:var(--panel);margin-bottom:-1px}
.pane{background:var(--panel);border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;padding:12px 14px;font-size:13.5px;white-space:pre-line}
.pane.rich{white-space:normal}
.obj{border-top:1px solid var(--line);padding:7px 0}
.obj:first-child{border-top:0}
.obj summary{cursor:pointer;font-weight:600}
.obj p{margin:6px 0 2px}
.draft{font-size:11px;color:var(--warn);margin-left:6px;font-weight:400}
/* message */
.msgbar{position:sticky;bottom:0;margin:16px -22px 0;padding:10px 22px;background:var(--panel);border-top:1px solid var(--line);display:flex;gap:12px;align-items:center}
.msgbar .pv{flex:1;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:0;background:var(--accent);color:#fff;border-radius:9px;padding:9px 16px;font-weight:600;white-space:nowrap}
.btn.ghost{background:var(--chip);color:var(--ink);font-weight:500}
.btn.done{background:var(--ok)}
#msgfull{display:none;white-space:pre-line;font-size:13px;background:var(--bg);border-radius:8px;padding:10px 12px;margin:10px 0 0}
#msgfull.open{display:block}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:9;cursor:zoom-out}
.zoom.open{display:flex}
.zoom img{max-width:96vw;max-height:94vh;border-radius:8px}
.welcome{color:var(--muted);max-width:520px;margin:60px auto;text-align:center;line-height:1.6}
@media (max-width:1100px){main{grid-template-columns:240px 260px 1fr}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>План Мечты · <span>подбор тура</span></h1>
    <input id="search" placeholder="Поиск: название, город, организатор">
    <span id="status">Загружаю таблицу…</span>
    <button id="reload" title="Перечитать данные (собираются с сайта)">Обновить</button>
  </header>
  <main>
    <aside class="col" id="filters"></aside>
    <section class="col" id="results"></section>
    <section class="col" id="detail"><div class="welcome">Отметьте слева, что важно туристу: города, длительность, месяц, формат, состав группы.<br>Справа появятся 1–2 лучших тура — их и предлагайте.</div></section>
  </main>
</div>
<div class="zoom" id="zoom"><img alt="Карта маршрута"></div>
<script src="extra.js"></script>
<script>
// Данные собирает collect.py с сайта planmydream.ru (каталог + страницы туров) в data.json.
const FORMATS = {classic:'Классика и история', nature:'Природа и горы', city:'Мегаполисы', practice:'Практики, ретрит', holiday:'Праздник', beach:'Пляж (опция)'};
const PACES = {calm:'Спокойный', medium:'Средний', active:'Активный'};
const GROUPS = {kids:'С детьми', couple:'Пара / друзья', solo:'Один / одна', senior:'55+'};
const TRANSPORT = {plane:['✈︎','перелёт'], train:['🚄','поезд'], bus:['🚐','авто'], night:['🛏','ночной поезд']};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today = new Date(); today.setHours(0,0,0,0);

let TOURS = [], DURS = [], state = {sights:new Set(), dur:new Set(), months:new Set(), formats:new Set(), pace:new Set(), group:new Set(), q:''};
let current = null, currentRow = null, tab = 'inc', showAllSights = false, showAllDates = false;

const pdate = s => { const m=/(\d{4})-(\d{2})-(\d{2})/.exec(s||''); return m ? new Date(+m[1], m[2]-1, +m[3]) : null; };
const fmtD = d => d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'}).replace('.','');
const monthKey = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const monthName = k => { const [y,m]=k.split('-'); const s=new Date(+y,m-1,1).toLocaleDateString('ru-RU',{month:'long'}); return s[0].toUpperCase()+s.slice(1)+' ’'+y.slice(2); };
const durMin = l => parseInt((l.match(/\d+/)||[99])[0]) - (/^до/i.test(l) ? 100 : 0);

function build(data){
  TOURS = data.tours.map(t => {
    const rows = t.departures.map(d => {
      const start = pdate(d.start), end = pdate(d.end);
      return {...d, start, end, days: Math.round((end-start)/864e5)+1, open: start>=today && d.seats!==0};
    });
    const single = ((t.excluded+'\n'+t.extras).match(/одноместн[^\n]*?(\$\s?\d[\d\s]*|\d[\d\s]*\s?(?:\$|₽|руб))/i)||[])[1] || '';
    const group = ((t.faq.find(f=>/сколько человек/i.test(f.q))||{}).a||'').match(/до\s*(\d+)/);
    const sights = t.sights.length ? t.sights : t.route.split(/\s+—\s+/);
    return {...t, key:t.slug, sights:[...new Set(sights.map(s=>s.trim()).filter(Boolean))], rows, open: rows.filter(r=>r.open),
      len: rows[0] ? rows[0].days : null, single: single.replace(/\s+/g,' ').trim(), group: group ? group[1] : '',
      extra: (window.TOUR_EXTRA||{})[t.slug] || {}};
  });
  DURS = [...new Set(TOURS.map(t=>t.duration).filter(Boolean))].sort((a,b)=>durMin(a)-durMin(b));
}

function score(t){
  const ex = t.extra, reasons = [];
  let s = 0, hard = !t.open.length;
  if(state.sights.size){
    const hit = [...state.sights].filter(c => t.sights.includes(c)), miss = [...state.sights].filter(c => !t.sights.includes(c));
    s += hit.length*3 - (hit.length ? 0 : 6);
    hit.forEach(c => reasons.push(['ok', c]));
    if(miss.length) reasons.push(['no', miss.join(', ')]);
  }
  if(state.dur.size){
    const ok = state.dur.has(t.duration); s += ok ? 2 : -3; reasons.push([ok?'ok':'no', t.duration.toLowerCase()]);
  }
  let dates = t.open;
  if(state.months.size){
    dates = t.open.filter(r => state.months.has(monthKey(r.start)));
    s += dates.length ? 3 : -5;
    reasons.push([dates.length?'ok':'no', dates.length ? 'даты: '+dates.slice(0,2).map(r=>fmtD(r.start)).join(', ') : 'нет дат в эти месяцы']);
  }
  if(state.formats.size){
    const hit = (ex.format||[]).filter(f => state.formats.has(f));
    s += hit.length*2 - (hit.length ? 0 : 3);
    hit.forEach(f => reasons.push(['ok', FORMATS[f].toLowerCase()]));
    if(!hit.length) reasons.push(['no', 'другой формат']);
  }
  if(state.pace.size && ex.pace){
    const ok = state.pace.has(ex.pace); s += ok?2:-2; reasons.push([ok?'ok':'no', 'темп: '+PACES[ex.pace].toLowerCase()]);
  }
  if(state.group.has('kids')){
    if(ex.adultsOnly){ hard = true; }
    else if(ex.pace==='active'){ s -= 1; reasons.push(['warn','активный темп']); }
  }
  if(state.group.has('senior') && ex.pace==='active'){ s -= 2; reasons.push(['warn','активный темп']); }
  if(state.group.has('senior') && ex.pace==='calm'){ s += 1; reasons.push(['ok','спокойный темп']); }
  if(state.group.has('solo')) reasons.push(['warn', t.single ? 'сингл +'+t.single : 'сингл: уточнить']);
  if(state.q){
    const hay = (t.title+' '+t.org+' '+t.route+' '+t.sights.join(' ')).toLowerCase();
    if(!state.q.toLowerCase().split(/\s+/).every(w=>hay.includes(w))) hard = true;
  }
  const near = dates[0] ? (dates[0].start - today)/864e5 : 999;
  return {t, s: s - near/1000, hard, reasons, dates};
}

function renderFilters(){
  const cnt = {};
  TOURS.forEach(t => t.open.length && t.sights.forEach(c => cnt[c]=(cnt[c]||0)+1));
  const sights = Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||a.localeCompare(b));
  const shown = showAllSights ? sights : sights.slice(0,14);
  const months = [...new Set(TOURS.flatMap(t=>t.open.map(r=>monthKey(r.start))))].sort();
  const chips = (name, items) => items.map(([k,l]) => `<button class="chip ${state[name].has(k)?'on':''}" data-set="${name}" data-k="${esc(k)}">${esc(l)}</button>`).join('');
  $('#filters').innerHTML = `
    <div class="fgroup"><h3>Города и места</h3><div class="chips">${chips('sights', shown.map(c=>[c,c]))}</div>
      ${sights.length>14?`<button class="more" id="moresights">${showAllSights?'Свернуть':'Все места ('+sights.length+')'}</button>`:''}</div>
    <div class="fgroup"><h3>Длительность</h3><div class="chips">${chips('dur', DURS.map(d=>[d,d]))}</div></div>
    <div class="fgroup"><h3>Месяц поездки</h3><div class="chips">${chips('months', months.map(m=>[m,monthName(m)]))}</div></div>
    <div class="fgroup"><h3>Формат <span class="draft">черновик</span></h3><div class="chips">${chips('formats', Object.entries(FORMATS))}</div></div>
    <div class="fgroup"><h3>Темп <span class="draft">черновик</span></h3><div class="chips">${chips('pace', Object.entries(PACES))}</div></div>
    <div class="fgroup"><h3>Кто едет</h3><div class="chips">${chips('group', Object.entries(GROUPS))}</div></div>
    <button id="reset">Сбросить всё</button>`;
}

const priceTxt = t => t.price ? '$'+t.price : 'цена на сайте не указана';

function renderResults(){
  const active = ['sights','dur','months','formats','pace','group'].some(k=>state[k].size);
  const list = TOURS.map(score).filter(x=>!x.hard).sort((a,b)=>b.s-a.s);
  window._scored = list;
  const card = (x, top) => `<div class="card ${top?'top':''} ${current===x.t?'sel':''}" data-key="${esc(x.t.key)}">
      <div class="t">${esc(x.t.title)}</div>
      <div class="m">${esc(x.t.org)} · ${x.t.len||'?'} дн. · ${esc(priceTxt(x.t))} · ближ. ${x.dates[0]?fmtD(x.dates[0].start):'—'}</div>
      ${x.reasons.length?`<div class="why">${x.reasons.map(([k,l])=>`<span class="tag ${k==='ok'?'':k}">${esc(l)}</span>`).join('')}</div>`:''}
    </div>`;
  if(!list.length){ $('#results').innerHTML = '<div class="empty">Ничего не нашлось. Снимите часть фильтров.</div>'; return; }
  if(!active){ $('#results').innerHTML = `<div class="rhead">${state.q?'Найдено':'Все туры с открытыми датами'} · ${list.length}</div><div class="compact">${list.map(x=>card(x,false)).join('')}</div>`; return; }
  const good = list.filter(x=>x.s>0);
  const top = (good.length?good:list).slice(0,2), rest = list.filter(x=>!top.includes(x));
  $('#results').innerHTML = `<div class="rhead">${good.length?'Предложите':'Точных совпадений нет — ближайшие'}</div>${top.map(x=>card(x,true)).join('')}
    ${rest.length?`<div class="rhead" style="margin-top:14px">Другие варианты</div><div class="compact">${rest.map(x=>card(x,false)).join('')}</div>`:''}`;
}

function routeHTML(t){
  const ex = t.extra;
  if(ex.legs && ex.legs.length){
    const parts = [];
    if(ex.arrive) parts.push(`<span class="city ext">прилёт</span><span class="leg"><span class="ic">✈︎</span><span class="ar">→</span></span>`);
    let prev = null;
    ex.legs.forEach(([d, from, to, tr, time]) => {
      if(from!==prev){ if(prev!==null) parts.push(`<span class="leg"><span class="ar">·</span></span>`); parts.push(`<span class="city">${esc(from)}</span>`); }
      const [ic] = TRANSPORT[tr]||['→'];
      parts.push(`<span class="leg"><span class="ic">${ic}</span><span>${esc(time.split(/ \(|, /)[0])}</span><span class="ar">——→</span><span>день ${d}</span></span><span class="city">${esc(to)}</span>`);
      prev = to;
    });
    if(ex.depart) parts.push(`<span class="leg"><span class="ic">✈︎</span><span class="ar">→</span></span><span class="city ext">вылет из ${esc(ex.depart)}</span>`);
    const cnt = {}; ex.legs.forEach(l => cnt[l[3]]=(cnt[l[3]]||0)+1);
    const sum = Object.entries(cnt).map(([k,n])=>`${n} ${TRANSPORT[k][1]}${n>1&&k!=='bus'?'а':''}`).join(' · ');
    return `<div class="route">${parts.join('')}</div>
      <div class="legsum">Переездов внутри Китая: <b>${ex.legs.length}</b> (${sum})</div>
      <ul class="leglist">${ex.legs.map(([d,f,to,tr,time])=>`<li>${TRANSPORT[tr][0]} <b>День ${d}.</b> ${esc(f)} → ${esc(to)}, ${TRANSPORT[tr][1]} — ${esc(time)}</li>`).join('')}</ul>
      ${ex.map?`<img class="map" src="${esc(ex.map)}" alt="Карта маршрута" loading="lazy">`:''}`;
  }
  // запасной вариант: фразы о переездах из программы на сайте
  const lines = [];
  t.days.forEach(d => {
    const head = d.split('\n')[0];
    d.split(/\n|(?<=[.!])\s+/).forEach(p => { if(/перел[её]т|поезд|переезд|автобус|трансфер на вокзал/i.test(p) && p.length<260) lines.push([head, p.trim()]); });
  });
  return `<div class="route">${t.route.split(/\s+—\s+/).map(c=>`<span class="city">${esc(c)}</span>`).join('<span class="leg"><span class="ar">→</span></span>')}</div>
    ${lines.length?`<ul class="auto" style="margin-top:10px">${lines.slice(0,8).map(([h,l])=>`<li><b>${esc(h)}.</b> ${esc(l)}</li>`).join('')}</ul>`:''}
    <div class="hint">Схема переездов с временем для этого тура ещё не заполнена — показаны фразы о переездах из программы на сайте.</div>`;
}

function scriptHTML(t){
  const txt = t.script;
  if(!txt) return `<div class="hint">Продающего скрипта пока нет. Описание с сайта:</div><p style="white-space:pre-line;font-size:13.5px">${esc(t.intro)}</p>`;
  const lines = txt.split('\n').map(s=>s.trim()).filter(Boolean);
  let tag='', bridge='', items=[], other=[];
  for(const l of lines){
    if(/^«/.test(l) && !tag) tag = l;
    else if(/^Мостик/i.test(l)) bridge = l.replace(/^Мостик:\s*/i,'');
    else if(/^Оплата/i.test(l) || /^Свойство\s*→/i.test(l)) continue;  // оплату показываем с сайта
    else if(/^[•\-–]/.test(l)) items.push(l.replace(/^[•\-–]\s*/,''));
    else other.push(l);
  }
  return `${tag?`<p class="tagline">${esc(tag)}</p>`:''}
    <ul class="ben">${items.map(i=>{ const [p,...g]=i.split('→'); return `<li>${g.length?`<span class="p">${esc(p.trim())}</span> → <span class="g">${esc(g.join('→').trim())}</span>`:esc(i)}</li>`; }).join('')}</ul>
    ${other.map(o=>`<div class="hint">${esc(o)}</div>`).join('')}
    ${bridge?`<div class="bridge">💬 ${esc(bridge)}</div>`:''}
    <div class="hint" style="margin-top:8px">Скрипт — из таблицы. Цены, даты и условия — с сайта.</div>`;
}

function fill(a, t, r){
  const flight = (t.excluded.match(/перел[её]т[^\n(]*\(([^)]+)\)/i)||[])[1] || 'уточню по вашим датам';
  const prepay = (t.payment.match(/(\d+)\s*%/)||[])[0];
  return a.replace('{flight}', flight)
    .replace(/\{prepay\}/g, prepay ? prepay+' от стоимости' : 'предоплата')
    .replace('{free}', r && r.seats!=null ? r.seats : '—')
    .replace('{group}', t.group || '10')
    .replace('{single}', t.single || '(уточню)');
}

function visibleDates(t, r, all = showAllDates){
  if(all) return t.rows;
  return t.rows.filter((x,i) => i<6 || x===r || (state.months.size && state.months.has(monthKey(x.start))));
}
const hiddenDates = (t, r) => visibleDates(t, r, true).length - visibleDates(t, r, false).length;

function renderDetail(){
  const t = current; if(!t) return;
  const r = currentRow || t.open[0] || t.rows[0] || null;
  const panes = {
    inc: ['Включено', t.included],
    exc: ['Не включено', t.excluded],
    pay: ['Оплата', t.payment + (t.extras ? '\n\nДополнительные услуги:\n'+t.extras : '')],
    obj: ['Возражения', null],
    faq: ['FAQ с сайта', null],
    prog: ['Программа', t.days.join('\n\n')],
    hotels: ['Проживание', t.hotels],
  };
  let body;
  if(tab==='obj') body = `<div class="hint" style="margin-bottom:6px">Цифры подставлены со страницы тура. <span class="draft">черновик — проверьте формулировки</span></div>` +
      (window.OBJECTIONS||[]).map(o=>`<details class="obj"><summary>${esc(o.q)}</summary><p>${esc(fill(o.a,t,r))}</p></details>`).join('');
  else if(tab==='faq') body = t.faq.map(f=>`<details class="obj"><summary>${esc(f.q)}</summary><p style="white-space:pre-line">${esc(f.a)}</p></details>`).join('') || '—';
  else body = esc(panes[tab][1] || '— на странице тура не найдено');
  const msg = r ? r.message : '';
  $('#detail').innerHTML = `
    <div class="d-top">
      <div><h2 class="d-title">${esc(t.title)}</h2>
        <div class="d-sub">${esc(t.org)} · ${t.len||'?'} дней · ${esc(t.route)} · <a href="${esc(t.url)}" target="_blank" rel="noopener">страница тура</a>${t.booklet?` · <a href="${esc(t.booklet)}" target="_blank" rel="noopener">буклет</a>`:''}</div></div>
      <div class="price"><b>${esc(priceTxt(t))}</b>${t.priceOld?` <s>$${t.priceOld}</s>`:''}<div>${t.single?'доплата за сингл '+esc(t.single):'сингл — уточнить'}</div></div>
    </div>
    ${t.extra.note?`<div class="note">⚠︎ ${esc(t.extra.note)}</div>`:''}
    <div class="dates">${visibleDates(t, r).map(x=>`<button class="date ${x===r?'on':''} ${!x.open?'full':''} ${state.months.size&&state.months.has(monthKey(x.start))?'match':''}" data-i="${t.rows.indexOf(x)}" ${!x.open?'disabled':''}>${fmtD(x.start)}–${fmtD(x.end)}<small>мест: ${x.seats??'?'}</small></button>`).join('') || '<span class="hint">Ближайших заездов на сайте нет</span>'}${hiddenDates(t, r)?`<button class="more" id="moredates">${showAllDates?'Свернуть даты':'ещё '+hiddenDates(t, r)+' дат'}</button>`:''}</div>
    <div class="grid2">
      <div class="box"><h2>Маршрут и переезды</h2>${routeHTML(t)}</div>
      <div class="box"><h2>Что сказать</h2>${scriptHTML(t)}</div>
    </div>
    <div class="tabs">${Object.entries(panes).map(([k,[l]])=>`<button class="tab ${tab===k?'on':''}" data-tab="${k}">${l}</button>`).join('')}</div>
    <div class="pane ${tab==='obj'||tab==='faq'?'rich':''}">${body}</div>
    <div class="msgbar">
      <span class="pv">${msg?esc(msg.split('\n')[1]||msg):'Нет открытых дат'}</span>
      <button class="btn ghost" id="msgtoggle" ${msg?'':'disabled'}>Показать</button>
      <button class="btn" id="copymsg" ${msg?'':'disabled'}>Скопировать сообщение клиенту</button>
    </div>
    <div id="msgfull">${esc(msg)}</div>`;
  $('#detail').scrollTop = 0;
}

function render(){ renderFilters(); renderResults(); }

document.addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if(chip){ const set = state[chip.dataset.set], k = chip.dataset.k; set.has(k)?set.delete(k):set.add(k); render(); return; }
  if(e.target.id==='moredates'){ showAllDates=!showAllDates; renderDetail(); return; }
  if(e.target.id==='moresights'){ showAllSights=!showAllSights; renderFilters(); return; }
  if(e.target.id==='reset'){ for(const k in state) if(state[k] instanceof Set) state[k].clear(); state.q=''; $('#search').value=''; render(); return; }
  const card = e.target.closest('.card');
  if(card){
    current = TOURS.find(t=>t.key===card.dataset.key);
    const sc = (window._scored||[]).find(x=>x.t===current);
    currentRow = (sc && sc.dates[0]) || current.open[0] || null;
    tab = 'inc'; showAllDates = false; renderResults(); renderDetail(); return;
  }
  const d = e.target.closest('.date');
  if(d && !d.disabled){ currentRow = current.rows[+d.dataset.i]; renderDetail(); return; }
  const tb = e.target.closest('.tab');
  if(tb){ tab = tb.dataset.tab; renderDetail(); return; }
  if(e.target.id==='msgtoggle'){ const f=$('#msgfull'); f.classList.toggle('open'); e.target.textContent=f.classList.contains('open')?'Скрыть':'Показать'; if(f.classList.contains('open')) f.scrollIntoView({block:'nearest'}); return; }
  if(e.target.id==='copymsg'){
    const r = currentRow || current.open[0], btn = e.target;
    const ok = () => { btn.textContent='Скопировано ✓'; btn.classList.add('done'); setTimeout(()=>{btn.textContent='Скопировать сообщение клиенту';btn.classList.remove('done');},1800); };
    (navigator.clipboard ? navigator.clipboard.writeText(r.message) : Promise.reject()).then(ok).catch(()=>{ const ta=document.createElement('textarea'); ta.value=r.message; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); ok(); });
    return;
  }
  if(e.target.classList.contains('map')){ const z=$('#zoom'); z.querySelector('img').src=e.target.src; z.classList.add('open'); return; }
  if(e.target.closest('#zoom')) $('#zoom').classList.remove('open');
});
$('#search').addEventListener('input', e => { state.q = e.target.value.trim(); renderResults(); });
$('#reload').addEventListener('click', () => load());

async function load(){
  $('#status').textContent = 'Загружаю…';
  try{
    const res = await fetch('data.json?_=' + Date.now());
    if(!res.ok) throw new Error(res.status);
    const data = await res.json();
    build(data);
    const at = new Date(data.generatedAt);
    $('#status').textContent = 'Данные с сайта на ' + at.toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
    $('#status').title = (data.warnings||[]).join('\n');
  }catch(err){
    $('#status').textContent = 'Не удалось загрузить данные (data.json)'; return;
  }
  if(current){ const k=current.key; current=TOURS.find(t=>t.key===k)||null; currentRow=null; }
  render(); if(current) renderDetail();
}
load();
</script>
</body>
</html>
