<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Подборщик туров</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c2412d'/%3E%3Cpath d='M32 12c-8.3 0-15 6.5-15 14.6C17 37.5 32 52 32 52s15-14.5 15-25.4C47 18.5 40.3 12 32 12z' fill='%23fff'/%3E%3Ccircle cx='32' cy='27' r='6' fill='%23c2412d'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f3ee; --panel:#ffffff; --ink:#1f1d1a; --muted:#6f6a62; --line:#e6e0d6;
  --accent:#c2412d; --accent-soft:#fbe9e5; --ok:#2f7d4f; --ok-soft:#e5f3ea; --warn:#9a6a00; --warn-soft:#fbf1d9;
  --chip:#f1ece4; --chip-on:#1f1d1a; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0 6px 0 0;white-space:nowrap}
header h1 span{color:var(--accent)}
.tgl{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px;font-size:13px;white-space:nowrap}
a.tgl:hover{background:var(--chip)}
.tgl[aria-pressed="true"]{background:var(--chip-on);color:#fff;border-color:var(--chip-on)}
#search{flex:1;max-width:360px;padding:6px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font:inherit}
#status{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
#status.stale{color:var(--accent);font-weight:600}
main{display:grid;grid-template-columns:250px 290px minmax(0,1fr);min-height:0}
body.no-filters main{grid-template-columns:290px minmax(0,1fr)}
body.no-results main{grid-template-columns:250px minmax(0,1fr)}
body.no-filters.no-results main{grid-template-columns:minmax(0,1fr)}
body.no-filters #filters, body.no-results #results{display:none}
.col{overflow:auto;min-height:0}
#filters{padding:12px 14px;border-right:1px solid var(--line);background:var(--panel)}
#results{padding:12px 10px;border-right:1px solid var(--line)}
#detail{padding:14px 20px 0}
.ftop{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:13px}
.ftop b{font-size:15px}
.link{border:0;background:none;color:var(--accent);padding:2px 0;font-size:12.5px}
.fgroup{margin-bottom:12px}
.fgroup h3{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 5px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:0;background:var(--chip);border-radius:999px;padding:3px 9px;font-size:12.5px}
.chip.on{background:var(--chip-on);color:#fff}
.draft{font-size:10px;color:var(--warn);margin-left:4px;font-weight:400;text-transform:none;letter-spacing:0}
.rhead{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:2px 4px 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin-bottom:7px;cursor:pointer;box-shadow:var(--shadow)}
.card.top{border-color:#e8b9ae}
.card.sel{outline:2px solid var(--accent);outline-offset:-1px}
.card .t{font-weight:600;font-size:13px;line-height:1.3}
.card .m{color:var(--muted);font-size:12px;margin-top:3px}
.card .why{margin-top:5px;display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11px;border-radius:6px;padding:1px 6px;background:var(--ok-soft);color:var(--ok)}
.tag.no{background:var(--chip);color:var(--muted);text-decoration:line-through}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.compact .card{padding:7px 10px;box-shadow:none}
.empty{color:var(--muted);padding:30px 10px;text-align:center}
.welcome{color:var(--muted);max-width:520px;margin:60px auto;text-align:center;line-height:1.6}
/* карта мест на пустом экране */
.mapview{display:flex;flex-direction:column;gap:8px;height:calc(100vh - 80px);padding-bottom:14px}
.mapview .mh{color:var(--muted);font-size:13px;line-height:1.45}
.mapview .mh b{color:var(--ink)}
#cmap{flex:1;min-height:380px;border-radius:12px;border:1px solid var(--line);background:#e8eef0}
.pin{position:relative;width:14px;height:14px;cursor:pointer}
.pin i{position:absolute;inset:0;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.35)}
.pin span{position:absolute;top:-5px;left:18px;white-space:nowrap;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:999px;padding:2px 8px;font:600 12px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.pin span b{color:var(--muted);font-weight:500;margin-left:2px}
.pin.l span{left:auto;right:18px}
.pin.b span{top:17px;left:50%;transform:translateX(-50%)}
.pin:hover span{border-color:var(--accent);color:var(--accent)}
.pin.on i{background:var(--accent);border-color:#fff}
.pin.on span{background:var(--accent);color:#fff;border-color:var(--accent)}
.pin.on span b{color:#fde3dd}
#cmap.small .pin span{display:none}
#cmap.small .pin:hover span,#cmap.small .pin.on span{display:block;z-index:5}
#cmap.small .pin:hover{z-index:1000}
.pin.part i{background:linear-gradient(90deg,var(--accent) 50%,#fff 50%)}
.leaflet-popup-content .pchips{display:flex;flex-direction:column;gap:4px;min-width:250px}
.leaflet-popup-content .pchip{white-space:nowrap}
.leaflet-popup-content .pchips h4{margin:0 0 2px;font-size:13px}
.leaflet-popup-content .pchip{border:0;background:var(--chip);border-radius:999px;padding:4px 10px;font:12.5px/1.3 inherit;font-family:inherit;text-align:left;cursor:pointer}
.leaflet-popup-content .pchip:hover{background:#e7e0d4}
.leaflet-popup-content .pchip.on{background:var(--chip-on);color:#fff}
.avform{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 10px;margin-top:4px}
.avform label{display:flex;flex-direction:column;gap:3px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.avform input:not([type=checkbox]),.avform select{font:inherit;font-size:13.5px;text-transform:none;letter-spacing:0;color:var(--ink);padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.avform .avchk{grid-column:span 2;flex-direction:row;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink);cursor:pointer;align-self:end;padding-bottom:6px}
.avwhole{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.alink{display:inline-block;text-decoration:none;font-size:13px;padding:6px 12px}
.btn.ghost.alink:hover{background:#e7e0d4}
.btn.alink:not(.ghost):hover{background:#a3341f}
.avleg{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:7px 0;border-top:1px dashed var(--line)}
.avl{display:flex;gap:6px}
.rcol{display:flex;flex-direction:column;gap:12px;min-width:0}
.mfrom{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:6px;white-space:nowrap}
.mfrom select{min-width:0;flex:1}
.mfrom select{font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.mrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;padding:5px 0;border-top:1px dashed var(--line);font-size:13px}
.mrow .pr{font-weight:700;color:var(--ok)}
.mrow .nop{color:var(--muted);font-size:12px}
.tline{display:block;width:100%;color:var(--muted);font-size:12px;margin-top:2px}
.tline a{color:var(--accent)}
.bag{display:inline-block;background:var(--ok-soft);color:var(--ok);border-radius:6px;padding:0 6px;font-size:11.5px}
.bag.no{background:var(--warn-soft);color:var(--warn)}
.mact{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 6px}
/* блок «✈ Перелёт» */
.mform{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px;margin-bottom:8px}
.mform label{display:flex;flex-direction:column;gap:2px;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);min-width:0}
.mform select{font:inherit;font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink);padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:0;width:100%;cursor:pointer}
.mform select:hover{border-color:#cfc6b8}
.mform .mfull,.mform .mmore,.mform .mextra{grid-column:1/-1}
.mform .mextra{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px;padding-top:2px}
.mform .mextra[hidden]{display:none}
.mmore{display:flex;flex-direction:column;align-items:flex-start;gap:1px;font:inherit;text-align:left;border:1px dashed var(--line);border-radius:8px;background:none;padding:5px 8px;cursor:pointer;color:var(--ink)}
.mmore span{font-size:13px;font-weight:600;color:var(--accent)}
.mmore small{font-size:11.5px;color:var(--muted)}
.mmore:hover{border-color:var(--accent);background:var(--accent-soft)}
.mform .mchk{grid-column:1/-1;flex-direction:row;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink);cursor:pointer}
.leg{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:13px}
.leg .lh{font-size:12px;color:var(--muted)}
.leg .lh b{color:var(--ink);text-transform:uppercase;letter-spacing:.05em;font-size:11px}
.leg .ltime{display:flex;align-items:baseline;gap:8px;margin-top:3px;font-size:13px;color:var(--muted)}
.leg .ltime b{font-size:17px;color:var(--ink)}
.leg .ltime .arr{color:var(--muted)}
.leg .lroute{margin-top:1px}
.leg .lmeta{color:var(--muted);font-size:12px;margin-top:1px}
.leg .lprice{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-top:6px}
.leg .pp{text-align:right;white-space:nowrap}
.leg .pp b{font-size:16px;color:var(--ok)}
.leg .pp small{display:block;color:var(--muted);font-size:11.5px}
.leg .nop{color:var(--muted);font-size:12px;margin-top:4px}
.leg .lnk{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;font-size:12.5px}
.ml{color:var(--accent);text-decoration:none}
.ml:hover{text-decoration:underline}
.avleg .pr{font-weight:700;color:var(--ok)}
.avleg .nop{color:var(--muted);font-size:12px}
.avl .alink{padding:4px 10px;font-size:12.5px}
.avtips{margin-top:10px;border-top:1px solid var(--line);padding-top:6px}
.avtips h3{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.avtips p{margin:4px 0 8px;white-space:pre-line;font-size:13px}
.pane .err{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:6px 10px;font-size:13px}
@media (max-width:1200px){.avform{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tomap{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:3px 9px;font-size:12px;color:var(--ink);margin-bottom:8px}
.tomap:hover{background:var(--chip)}
/* карточка тура */
.d-top{display:flex;gap:16px;align-items:flex-start}
.d-title{font-size:19px;font-weight:700;line-height:1.25;margin:0}
.d-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:5px;font-size:12.5px;color:var(--muted)}
.d-meta a{color:var(--accent)}
.org{background:var(--chip);color:var(--ink);border-radius:999px;padding:2px 10px}
.d-route{margin-top:5px;font-size:14px;font-weight:600}
.d-route span{color:var(--muted);font-weight:400;margin-right:4px}
.price{margin-left:auto;text-align:right;white-space:nowrap}
.price b{font-size:21px}
.price s{color:var(--muted);margin-left:4px}
.price div{color:var(--muted);font-size:12px}
.note{margin-top:8px;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:5px 10px;font-size:13px}
.dates{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 2px;align-items:center}
.date{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:3px 8px;font-size:12.5px}
.date small{color:var(--muted);margin-left:4px}
.date.match{border-color:var(--ok)}
.date.on{background:var(--chip-on);color:#fff;border-color:var(--chip-on)}
.date.on small{color:#ddd}
.date.full{opacity:.45;text-decoration:line-through;cursor:default}
.more{border:0;background:none;color:var(--accent);font-size:12px;padding:3px 2px}
.cheat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13px;line-height:1.35}
.cell .muted{color:var(--muted);font-size:11.5px}
.cell i{display:block;font-style:normal;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:12px;margin-top:10px;align-items:start}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.box h2{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
/* сценарий */
.step{display:grid;grid-template-columns:22px 1fr;gap:4px 8px;padding:7px 0;border-top:1px solid var(--line)}
.step:first-of-type{border-top:0;padding-top:2px}
.step .n{width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.step .h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.step .say{grid-column:2;font-size:14px}
.step ul{margin:3px 0 0;padding-left:17px}
.step li{margin:2px 0}
.step .g{color:var(--ok)}
.step .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.step.close .say{background:var(--accent-soft);border-radius:8px;padding:6px 9px}
.src{color:var(--muted);font-size:11.5px;margin-top:6px}
/* маршрут */
.legs{list-style:none;margin:0;padding:0;font-size:13.5px}
.legs li{display:grid;grid-template-columns:24px 1fr;gap:6px;padding:5px 0;border-top:1px dashed var(--line)}
.legs li:first-child{border-top:0}
.legs .ic{text-align:center}
.legs b{font-weight:600}
.legs small{color:var(--muted)}
.legsum{margin-top:6px;font-size:13px}
.legsum b{color:var(--accent)}
.map{margin-top:8px;width:100%;border-radius:8px;cursor:zoom-in;display:block}
.hint{color:var(--muted);font-size:12px;margin-top:6px}
/* ответы */
.answers{margin-top:12px}
.abar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
#ask{flex:0 1 260px;padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font:inherit;margin-bottom:5px}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tab{border:0;background:none;padding:6px 10px;border-radius:8px 8px 0 0;color:var(--muted);font-size:13px}
.tab.on{background:var(--panel);color:var(--ink);font-weight:600;border:1px solid var(--line);border-bottom-color:var(--panel);margin-bottom:-1px}
/* без внутренней прокрутки: высота вкладки растёт под текст и не уменьшается при переключении (renderPane) — страница не прыгает */
.pane{background:var(--panel);border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;padding:0 14px 10px;font-size:13.5px;white-space:pre-line;min-height:300px}
.pane > :first-child:not(.pbar){margin-top:10px}
.pane.rich{white-space:normal}
.obj{border-top:1px solid var(--line);padding:6px 0}
.obj:first-child{border-top:0}
.obj summary{cursor:pointer;font-weight:600}
.obj p{margin:5px 0 2px;white-space:pre-line}
.obj .from{font-size:11px;color:var(--muted);font-weight:400;margin-left:6px}
mark{background:#fff0b3;border-radius:3px}
.msgbar{position:sticky;bottom:0;margin:14px -20px 0;padding:9px 20px;background:var(--panel);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.msgbar .pv{flex:1;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:0;background:var(--accent);color:#fff;border-radius:9px;padding:8px 14px;font-weight:600;white-space:nowrap}
.btn.ghost{background:var(--chip);color:var(--ink);font-weight:500}
.btn.done{background:var(--ok)}
.pbar{position:sticky;top:0;display:flex;align-items:center;gap:10px;padding:8px 0 6px;background:var(--panel);white-space:normal}
.pbar .hint{margin:0;flex:1}
.icopy{border:0;background:none;color:var(--accent);padding:4px;border-radius:6px;display:inline-flex;line-height:0}
.icopy:hover{background:var(--accent-soft)}
.icopy.done{color:var(--ok)}
.ptext{white-space:pre-line}
.ptext a{color:var(--accent);word-break:break-all}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:9;cursor:zoom-out}
.zoom.open{display:flex}
.zoom img{max-width:96vw;max-height:94vh;border-radius:8px}
@media (max-width:1200px){.grid2{grid-template-columns:1fr}.cheat{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>План Мечты · <span>подбор тура</span></h1>
    <a class="tgl" href="hotels.html" title="Цены отелей TEZ TOUR и предложение клиенту" style="text-decoration:none">🏨 Отели TEZ →</a>
    <button class="tgl" id="tgl-filters" aria-pressed="true" title="Показать / скрыть фильтры">☰ Фильтры</button>
    <button class="tgl" id="tgl-results" aria-pressed="true" title="Показать / скрыть список туров">▤ Подборка</button>
    <input id="search" placeholder="Поиск тура: название, город, организатор">
    <span id="status">Загружаю…</span>
    <button class="tgl" id="reload" title="Перечитать данные (собираются с сайта раз в 4 часа)">Обновить</button>
  </header>
  <main>
    <aside class="col" id="filters"></aside>
    <section class="col" id="results"></section>
    <section class="col" id="detail"><div class="welcome">Отметьте слева, что важно туристу: кто едет, когда, сколько дней, что хочет увидеть.<br>В подборке появятся 1–2 лучших тура — их и предлагайте.</div></section>
  </main>
</div>
<div class="zoom" id="zoom"><img alt="Карта маршрута"></div>
<script src="extra.js"></script>
<script>
// Данные собирает collect.py с сайта planmydream.ru (каталог + страницы туров) в data.json.
const FORMATS = {classic:'Классика и история', nature:'Природа и горы', city:'Мегаполисы', practice:'Практики, ретрит', holiday:'Праздник', beach:'Пляж (опция)'};
const PACES = {calm:'Спокойный', medium:'Средний', active:'Активный'};
const GROUPS = {kids:'С детьми', solo:'Один / одна', senior:'55+'};
const TRANSPORT = {plane:['✈︎','перелёт','перелёта'], train:['🚄','поезд','поезда'], bus:['🚐','на авто','на авто'], night:['🛏','ночной поезд','ночных поезда'], move:['🧳','переезд','переезда']};
const SERVICE = /билет|отел|гид|групп|alipay|оплат|страхов|включ|трансфер|завтрак|сопровожд|чат|логистик/i;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today = new Date(); today.setHours(0,0,0,0);
const SOON = 14; // заезды ближе 14 дней по умолчанию не предлагаем — новый клиент не успеет

let TOURS = [], DURS = [], GENERATED = null, RATES = null;
const SETS = ['group','months','dur','sights','pace','formats'];
const state = {months:new Set(), dur:new Set(), sights:new Set(), group:new Set(), formats:new Set(), pace:new Set(), q:''};
let current = null, currentRow = null, tab = 'obj', ask = '', showAllSights = false, showAllDates = false;

const pdate = s => { const m=/(\d{4})-(\d{2})-(\d{2})/.exec(s||''); return m ? new Date(+m[1], m[2]-1, +m[3]) : null; };
const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmtD = d => d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'}).replace('.','');
const fmtLong = d => d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
const monthKey = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const monthName = k => { const [y,m]=k.split('-'); const s=new Date(+y,m-1,1).toLocaleDateString('ru-RU',{month:'long'}); return s[0].toUpperCase()+s.slice(1)+' ’'+y.slice(2); };
const durMin = l => parseInt((l.match(/\d+/)||[99])[0]) - (/^до/i.test(l) ? 100 : 0);
const plural = (n, a, b, c) => { n=Math.abs(n)%100; const k=n%10; return n>10&&n<20 ? c : k===1 ? a : k>=2&&k<=4 ? b : c; };
const dayWord = n => n+' '+plural(n,'день','дня','дней');
const store = (k, v) => { try{ v===undefined ? localStorage.removeItem(k) : localStorage.setItem(k, v); }catch(_){} };
const load_ = k => { try{ return localStorage.getItem(k); }catch(_){ return null; } };

// --- разбор текстов сайта -------------------------------------------------
const bullets = txt => (txt||'').split('\n').map(l=>l.replace(/^•\s*/,'').trim()).filter(l=>l && !/^(Следующие|Также можно)/.test(l));
function short(line, max = 64, withDetail = true, cut = /\s\(|;|\. |: /){
  let s = line.replace(/\s+/g,' ').trim();
  const c = s.indexOf(':');
  if(c>0 && c<45){ const head = s.slice(0,c).trim(), tail = s.slice(c+1).trim().split(cut)[0]; s = withDetail && tail ? head+' — '+tail : head; }
  else s = s.split(cut)[0];
  if(s.length > max) s = s.replace(/\s+[^\s,]+\s*→.*$/, '');  // длинный маршрут «Москва → Шанхай → …» в коротком пункте не нужен
  if(s.length>max){  // режем по целой фразе (запятая, тире, «и»), без многоточия
    const part = s.slice(0, max), at = Math.max(part.lastIndexOf(', '), part.lastIndexOf(' — '), part.lastIndexOf(' и '));
    s = at > max * 0.4 ? part.slice(0, at) : part.slice(0, part.lastIndexOf(' '));
    s = s.replace(/(\s+(в|на|с|со|и|по|для|до|из|от|к|у|о|об|за|при))+$/i, '').replace(/[,—\-:\s]+$/, '');
  }
  return s.replace(/\s+(на протяжении\s+)?(всего|всей|всех|весь)$/i, '').replace(/[:,—\-\s]+$/, '').replace(/\.$/,'');
}
const lc = s => s ? s[0].toLowerCase()+s.slice(1) : s;
const REFUND = /возврат|отмен|удерж|невыезд/i;  // условия возврата — не схема оплаты
const payLines = t => bullets(t.payment).filter(l=>/%/.test(l) && !REFUND.test(l));
// --- рубли: курс ЦБ на сегодня; у туров Влада — продажа $ в ТБанке + 2% (решение пользователя 06.11.2026) ---
const CASH = /наличн|в долларах|на месте|при встрече|по прибыти|в аэропорту|в день начала/i;
const num2 = n => n.toLocaleString('ru-RU', {maximumFractionDigits: 2});
const rubTxt = n => Math.round(n).toLocaleString('ru-RU') + ' ₽';
const usdTxt = n => '$' + num2(Math.round(n * 100) / 100);
function rateFor(t){
  if(!RATES) return null;
  if(/^Влад/i.test(t.org) && RATES.tbank){ const v = RATES.tbank.sell * 1.02; return {v, label: `курс ТБанка ${num2(RATES.tbank.sell)} + 2% = ${num2(Math.round(v*100)/100)} ₽`}; }
  if(RATES.cbr){ const d = RATES.cbr.date.split('-'); return {v: RATES.cbr.value, label: `курс ЦБ ${num2(RATES.cbr.value)} ₽ на ${d[2]}.${d[1]}`}; }
  return null;
}
// Платежи по строкам «Порядка оплаты»: в одной строке может быть несколько процентов («35% … оставшиеся 50% наличными»)
function payPlan(t, r){
  if(!r || !r.price) return [];
  const out = [], allRub = /все платежи[^.\n]*рубл/i.test(t.payment);  // Влад: «все платежи конвертируются в рубли»
  payLines(t).forEach(line => {
    const ms = [...line.matchAll(/(\d+)\s*%/g)];
    ms.forEach((m, i) => {
      const seg = line.slice(m.index, i+1 < ms.length ? ms[i+1].index : undefined);
      const pct = +m[1], usd = r.price * pct / 100, cash = !allRub && CASH.test(seg) && !/рубл/i.test(seg);
      if(out.reduce((a, p) => a + p.pct, 0) + pct <= 100) out.push({pct, usd, cash, rate: rateFor(t), src: line});  // «+2% к курсу» — не платёж
    });
  });
  const sum = out.reduce((a, p) => a + p.pct, 0);
  if(out.length && sum < 100){  // на сайте назван только первый платёж — остаток считаем сами
    const line = bullets(t.payment).find(l => /оставш|окончательн/i.test(l) && !/%/.test(l)) || '';
    const pct = 100 - sum;
    out.push({pct, usd: r.price * pct / 100, cash: !allRub && CASH.test(line) && !/рубл/i.test(line), rate: rateFor(t), rest: true, src: line});
  }
  return out;
}
const payAmt = p => p.cash ? `${usdTxt(p.usd)} наличными на месте` : p.rate ? `${rubTxt(p.usd * p.rate.v)} (${usdTxt(p.usd)})` : usdTxt(p.usd);
// сумма в скобках к строке порядка оплаты: «$340,5 ≈ 27 851 ₽», наличные — только в $
const payNote = p => p.cash ? `${usdTxt(p.usd)} наличными` : p.rate ? `${usdTxt(p.usd)} ≈ ${rubTxt(p.usd * p.rate.v)}` : usdTxt(p.usd);
const percents = t => [...new Set((payLines(t).join(' ').match(/\d+\s*%/g)||[]).map(x=>x.replace(/\s/,'')))];
const exclShort = t => { const m = (t.intro||'').match(/Вс[её] включено[^\n.]*/); return m ? m[0].trim() : (bullets(t.excluded).length ? 'Не входит: '+bullets(t.excluded).slice(0,3).map(l=>lc(short(l,40,false))).join(', ') : ''); };

// Ручные данные (extra.js) или — для нового тура / изменившейся программы — автодописанные Claude (data.json → auto)
function withAuto(t){
  const manual = (window.TOUR_EXTRA||{})[t.slug] || {}, a = t.auto;
  if(!a) return {extra: manual, seeList: (window.TOUR_SEE||{})[t.slug] || [], talk: (window.TOUR_TALK||{})[t.slug] || '', isAuto: false};
  const {map, ...rest} = manual;  // старая карта может не совпадать с новой программой
  return {
    extra: {...rest, format: a.format, pace: a.pace, adultsOnly: a.adultsOnly, note: a.note || rest.note, arrive: a.arrive, depart: a.depart,
      legs: a.legs.map(l => [l.day, l.from, l.to, l.transport, l.time])},
    seeList: a.see.map(x => [x.city, x.what, x.benefit]), talk: a.talk || '', isAuto: true, autoReason: a.reason,
  };
}

function build(data){
  GENERATED = new Date(data.generatedAt);
  RATES = data.rates || null;
  TOURS = data.tours.map(t => {
    const rows = t.departures.map(d => {
      const start = pdate(d.start), end = pdate(d.end), months = new Set();
      for(let x = new Date(start.getFullYear(), start.getMonth(), 1); x <= end; x.setMonth(x.getMonth()+1)) months.add(monthKey(x));
      return {...d, start, end, months, days: Math.round((end-start)/864e5)+1, open: start>=today && d.seats!==0};
    });
    const sights = t.sights.length ? t.sights : t.route.split(/\s+—\s+/);
    const lens = [...new Set(rows.map(r=>r.days))].sort((a,b)=>a-b);
    return {...t, key:t.slug, sights:[...new Set(sights.map(s=>s.trim()).filter(Boolean))], rows, open: rows.filter(r=>r.open),
      lenTxt: lens.length>1 ? lens[0]+'–'+lens[lens.length-1]+' дн.' : (lens[0]||'?')+' дн.',
      minPrice: Math.min(...rows.filter(r=>r.open).map(r=>r.price||Infinity), t.price||Infinity),
      ...withAuto(t)};
  });
  DURS = [...new Set(TOURS.map(t=>t.duration).filter(Boolean))].sort((a,b)=>durMin(a)-durMin(b));
}

// --- подбор ----------------------------------------------------------------
function score(t){
  const ex = t.extra, reasons = [];
  let s = 0, hard = !t.open.length;
  let dates = t.open;
  if(state.months.size){
    dates = t.open.filter(r => [...r.months].some(m => state.months.has(m)));
    s += dates.length ? 3 : -5;
    reasons.push([dates.length?'ok':'no', dates.length ? 'даты: '+dates.slice(0,2).map(r=>fmtD(r.start)).join(', ') : 'нет дат в эти месяцы']);
  }
  if(state.dur.size){ const ok = state.dur.has(t.duration); s += ok ? 2 : -3; reasons.push([ok?'ok':'no', t.duration.toLowerCase()]); }
  if(state.sights.size){
    const hit = [...state.sights].filter(c => t.sights.includes(c)), miss = [...state.sights].filter(c => !t.sights.includes(c));
    s += hit.length*3 - (hit.length ? 0 : 6);
    hit.forEach(c => reasons.push(['ok', c]));
    if(miss.length) reasons.push(['no', miss.join(', ')]);
  }
  if(state.group.has('kids')){
    if(ex.adultsOnly) hard = true;
    else if(ex.pace==='active'){ s -= 1; reasons.push(['warn','активный темп']); }
  }
  if(state.group.has('senior')){
    if(ex.pace==='active'){ s -= 2; reasons.push(['warn','активный темп']); }
    if(ex.pace==='calm'){ s += 1; reasons.push(['ok','спокойный темп']); }
  }
  if(state.group.has('solo')) reasons.push([t.single||t.roommate?'ok':'warn', t.single ? 'сингл +'+t.single : t.roommate ? 'подселим в пару' : 'сингл: уточнить']);
  if(state.formats.size){
    const hit = (ex.format||[]).filter(f => state.formats.has(f));
    s += hit.length*2 - (hit.length ? 0 : 3);
    hit.forEach(f => reasons.push(['ok', FORMATS[f].toLowerCase()]));
    if(!hit.length) reasons.push(['no', 'другой формат']);
  }
  if(state.pace.size && ex.pace){ const ok = state.pace.has(ex.pace); s += ok?2:-2; reasons.push([ok?'ok':'no', 'темп: '+PACES[ex.pace].toLowerCase()]); }
  if(state.q){
    const hay = (t.title+' '+t.org+' '+t.route+' '+t.sights.join(' ')).toLowerCase();
    if(!state.q.toLowerCase().split(/\s+/).every(w=>hay.includes(w))) hard = true;
  }
  const near = dates[0] ? (dates[0].start - today)/864e5 : 999;
  return {t, s: s - near/1000, hard, reasons, dates};
}
const scored = () => TOURS.map(score).filter(x=>!x.hard).sort((a,b)=>b.s-a.s);
const activeFilters = () => SETS.some(k=>state[k].size);

function renderFilters(){
  const cnt = {};
  TOURS.forEach(t => t.open.length && t.sights.forEach(c => cnt[c]=(cnt[c]||0)+1));
  const sights = Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||a.localeCompare(b));
  const shown = showAllSights ? sights : sights.filter((c,i)=>i<14 || state.sights.has(c));
  const months = [...new Set(TOURS.flatMap(t=>t.open.flatMap(r=>[...r.months])))].sort();
  const chips = (name, items) => items.map(([k,l]) => `<button class="chip ${state[name].has(k)?'on':''}" data-set="${name}" data-k="${esc(k)}">${esc(l)}</button>`).join('');
  const n = scored().length;
  $('#filters').innerHTML = `
    <div class="ftop"><span>Найдено туров: <b>${n}</b></span>${activeFilters()||state.q?'<button class="link" id="reset">Сбросить</button>':''}</div>
    <div class="fgroup"><h3>1 · Кто едет</h3><div class="chips">${chips('group', Object.entries(GROUPS))}</div></div>
    <div class="fgroup"><h3>2 · Когда</h3><div class="chips">${chips('months', months.map(m=>[m,monthName(m)]))}</div></div>
    <div class="fgroup"><h3>3 · Сколько дней</h3><div class="chips">${chips('dur', DURS.map(d=>[d,d]))}</div></div>
    <div class="fgroup"><h3>4 · Что хочет увидеть</h3><div class="chips">${chips('sights', shown.map(c=>[c,c]))}</div>
      ${sights.length>14?`<button class="more" id="moresights">${showAllSights?'Свернуть':'Все места ('+sights.length+')'}</button>`:''}</div>
    <div class="fgroup"><h3>5 · Темп <span class="draft">черновик</span></h3><div class="chips">${chips('pace', Object.entries(PACES))}</div></div>
    <div class="fgroup"><h3>6 · Формат <span class="draft">черновик</span></h3><div class="chips">${chips('formats', Object.entries(FORMATS))}</div></div>`;
}

// «мест: 3 из 10» — свободно из всего в группе (всего — из таблицы или FAQ сайта)
const seatsTxt = (x, long) => x.total ? `${long ? 'свободно' : 'мест'}: ${x.seats ?? '?'} из ${x.total}` : `мест: ${x.seats ?? '?'}`;
const priceTxt = p => p && isFinite(p) ? '$'+p : 'цена не указана';
function renderResults(){
  const list = scored();
  const card = (x, top) => `<div class="card ${top?'top':''} ${current===x.t?'sel':''}" data-key="${esc(x.t.key)}">
      <div class="t">${esc(x.t.title)}</div>
      <div class="m">${esc(x.t.org)} · ${x.t.lenTxt} · ${x.t.rows.length>1&&new Set(x.t.rows.map(r=>r.price)).size>1?'от ':''}${priceTxt(x.t.minPrice)} · ближ. ${x.dates[0]?fmtD(x.dates[0].start):'—'}</div>
      ${x.reasons.length?`<div class="why">${x.reasons.map(([k,l])=>`<span class="tag ${k==='ok'?'':k}">${esc(l)}</span>`).join('')}</div>`:''}
    </div>`;
  if(!list.length){ $('#results').innerHTML = '<div class="empty">Ничего не нашлось. Снимите часть фильтров.</div>'; return; }
  if(!activeFilters()){ $('#results').innerHTML = `<div class="rhead">${state.q?'Найдено':'Все туры с открытыми датами'} · ${list.length}</div><div class="compact">${list.map(x=>card(x,false)).join('')}</div>`; return; }
  const good = list.filter(x=>x.s>0);
  const top = (good.length?good:list).slice(0,2), rest = list.filter(x=>!top.includes(x));
  $('#results').innerHTML = `<div class="rhead">${good.length?'Предложите':'Точных совпадений нет — ближайшие'}</div>${top.map(x=>card(x,true)).join('')}
    ${rest.length?`<div class="rhead" style="margin-top:12px">Другие варианты</div><div class="compact">${rest.map(x=>card(x,false)).join('')}</div>`:''}`;
}

// --- карточка тура ---------------------------------------------------------
function pickRow(t){
  const sc = score(t), pool = sc.dates.length ? sc.dates : t.open;
  const later = new Date(today); later.setDate(later.getDate()+SOON);
  return pool.find(r=>r.start>=later) || pool[0] || t.rows[0] || null;
}

function routeHTML(t, r){
  const ex = t.extra;
  // «вариант N дней» — переезд есть только в этом варианте тура (Новый год)
  const legs = (ex.legs||[]).filter(l => { const m = /вариант (\d+) дн/.exec(l[4]); return !m || !r || +m[1]===r.days; });
  if(ex.legs && !legs.length) return `<div style="font-weight:600">${esc(r ? t.route.split(/\s+—\s+/)[0] : t.route)}</div><div class="legsum">В этом варианте переездов между городами нет — весь тур в одном городе.</div>`;
  if(legs.length){
    const cnt = {}; legs.forEach(l => cnt[l[3]]=(cnt[l[3]]||0)+1);
    const sum = Object.entries(cnt).map(([k,n])=>`${n} ${n>1?TRANSPORT[k][2]:TRANSPORT[k][1]}`).join(', ');
    return `<ul class="legs">
      ${ex.arrive?`<li><span class="ic">🛬</span><span><b>Прилёт:</b> ${esc(ex.arrive)} <small>(международный перелёт — отдельно)</small></span></li>`:''}
      ${legs.map(([d,f,to,tr,time])=>`<li><span class="ic">${TRANSPORT[tr][0]}</span><span><b>День ${d}:</b> ${esc(f)} → ${esc(to)}<br><small>${TRANSPORT[tr][1]} · ${esc(time.replace(/\s*—?\s*вариант \d+ дней/,'') || 'время уточнить')}</small></span></li>`).join('')}
      ${ex.depart?`<li><span class="ic">🛫</span><span><b>Вылет домой:</b> ${esc(ex.depart)}</span></li>`:''}
    </ul>
    <div class="legsum">Переездов внутри Китая: <b>${legs.length}</b> (${sum}) — по «Что включено» и программе на сайте</div>
    ${ex.map?`<img class="map" src="${esc(ex.map)}" alt="Карта маршрута" loading="lazy">`:''}`;
  }
  const lines = [];
  t.days.forEach(d => {
    const head = d.split('\n')[0].replace(/\s*\(.*\)$/,'');
    d.split(/\n|(?<=[.!])\s+/).forEach(p => { if(/перел[её]т|поезд|переезд|автобус|трансфер на вокзал/i.test(p) && p.length<220) lines.push([head, p.trim()]); });
  });
  return `<div style="font-weight:600;margin-bottom:4px">${esc(t.route)}</div>
    ${lines.length?`<ul class="legs">${lines.slice(0,8).map(([h,l])=>`<li><span class="ic">${/перел[её]т|аэропорт/i.test(l)?'✈︎':/поезд|вокзал/i.test(l)?'🚄':'🚐'}</span><span><b>${esc(h)}:</b> ${esc(l)}</span></li>`).join('')}</ul>`:''}
    <div class="hint">Точная схема с временем переездов для этого тура ещё не заполнена — показаны фразы о переездах из программы на сайте.</div>`;
}

function benefits(t){
  const items = (t.script||'').split('\n').map(s=>s.trim()).filter(l=>/^[•\-–]/.test(l) && l.includes('→')).map(l=>l.replace(/^[•\-–]\s*/,''));
  const places = items.filter(i=>!SERVICE.test(i.split('→')[0]));
  return (places.length ? places : items).slice(0,3).map(i => { const [p,...g]=i.split('→'); return [short(p,80,true).replace(' — ',': '), g.join('→').trim()]; });
}

function scriptHTML(t, r){
  const tagline = ((t.script||'').match(/«([^»]+)»/)||[])[1];
  const see = (t.seeList||[]).filter(([c]) => !/вариант\S*\s*\d/.test(c) || !r || (c.match(/\d+/g)||[]).map(Number).includes(r.days));
  const ben = benefits(t);
  const inc = bullets(t.included).slice(0,4).map(l=>short(l,85)), exc = bullets(t.excluded).slice(0,4).map(l=>short(l,75,false));
  const plan = payPlan(t, r);
  // строка без процентов — только до конца первого предложения
  const payText = l => short(l,150,true,/%/.test(l) ? /\s\(|;/ : /\s\(|;|\. /).replace(/^Предоплата \(бронирование\) — Для подтверждения брони требуется предоплата в размере/,'Бронь — предоплата');
  const srcLines = bullets(t.payment).filter(l=>(/%|валют|рубл|доллар/i.test(l) || plan.some(p=>p.src===l)) && !REFUND.test(l));
  const pays = srcLines.slice(0,5).map(l => {
    const items = plan.filter(p => p.src === l);
    const note = items.length === 1 ? payNote(items[0]) : items.map(p => `${p.pct}% — ${payNote(p)}`).join('; ');
    return payText(l) + (note ? ` (${note})` : '');
  });
  const lost = plan.filter(p => p.rest && !p.src);  // остаток, которого нет в тексте сайта
  lost.forEach(p => pays.push(`Остаток ${p.pct}% — сроки в договоре (${payNote(p)})`));
  const prepay = percents(t)[0] || '';
  const near = t.open.filter(x=>x!==r && (!r || +x.start!==+r.start) && Math.abs(x.start-(r?r.start:today))<50*864e5);
  const others = [...near.filter(x=>r&&x.start>r.start), ...near].slice(0,1); // сначала следующий заезд, потом предыдущий
  const steps = [
    ['Предложение', `Под ваши пожелания могу предложить тур «${esc(t.title)}»${r?` — ${dayWord(r.days)}, с ${fmtLong(r.start)} по ${fmtLong(r.end)}`:''}. Маршрут: ${esc(t.route)}.${tagline?`<div class="sub">${esc(tagline)}</div>`:''}`],

// Программа «как в договоре» — из таблицы. Если для выбранного заезда её нет, берём расписание
// другого заезда этого тура и пересчитываем даты в заголовках «День N (дд.мм)».
function contractText(t, r){
  const list = t.contract || [];
  if(!list.length) return {text: t.days.join('\n\n'), contract:false};
  const key = r ? iso(r.start)+'_'+iso(r.end) : '';
  const exact = list.find(c => c.start+'_'+c.end === key);
  if(exact || !r) return {text: (exact||list[0]).text, contract:true};
  const same = list.find(c => pdate(c.end) && Math.round((pdate(c.end)-pdate(c.start))/864e5)+1 === r.days) || list[0];
  const dd = n => { const x = new Date(r.start); x.setDate(x.getDate()+n-1); return String(x.getDate()).padStart(2,'0')+'.'+String(x.getMonth()+1).padStart(2,'0'); };
  const text = same.text.replace(/((?:День|Дни)\s*)(\d+)(?:\s*[–-]\s*(\d+))?\s*\([^)]*\)/g, (m, w, a, b) => `${w}${a}${b?'–'+b:''} (${dd(+a)}${b?'–'+dd(+b):''})`);
  return {text, contract:true, redated:true};
}

}

  if(current) p.set('t', current.key);
  if(current && currentRow) p.set('d', iso(currentRow.start)+'_'+iso(currentRow.end));
  history.replaceState(null, '', '#'+p.toString());
  store('podbor-lasthash', '#'+p.toString());   // для кнопки «← Подбор тура» на странице «Отели TEZ»
}
function readHash(){
  const p = new URLSearchParams(location.hash.slice(1));
  SETS.forEach(k => { state[k] = new Set((p.get(k)||'').split('|').filter(Boolean)); });
  state.q = p.get('q')||''; $('#search').value = state.q;
  current = TOURS.find(t=>t.key===p.get('t')) || null;

  if(current){ const d = p.get('d'); currentRow = (d && current.rows.find(r=>iso(r.start)+'_'+iso(r.end)===d && r.open)) || pickRow(current); }
}

const placeCounts = () => { const c = {}; TOURS.forEach(t => t.open.length && t.sights.forEach(s => c[s] = (c[s] || 0) + 1)); return c; };

function loadLeaflet(){
  if (window.L) return Promise.resolve();
  if (loadLeaflet.p) return loadLeaflet.p;
  const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
  document.head.appendChild(css);
  return loadLeaflet.p = new Promise((ok, bad) => {
    const s = document.createElement('script'); s.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    s.onload = ok; s.onerror = () => { loadLeaflet.p = null; bad(); }; document.head.appendChild(s);
  });
}

function pinHtml(g, cnt){
  const sel = g.places.filter(p => state.sights.has(p)).length;
  const n = new Set(TOURS.filter(t => t.open.length && t.sights.some(s => g.places.includes(s))).map(t => t.key)).size;
  return `<div class="pin ${g.dir} ${sel ? (sel === g.places.filter(p => cnt[p]).length ? 'on' : 'on part') : ''}" title="${esc(g.places.join(', '))}"><i></i><span>${esc(g.label)} <b>${n}</b></span></div>`;
}
function popupHtml(g, cnt){
  return `<div class="pchips"><h4>${esc(g.label)}</h4>${g.places.filter(p => cnt[p]).map(p =>
    `<button class="pchip ${state.sights.has(p) ? 'on' : ''}" data-k="${esc(p)}">${state.sights.has(p) ? '✓ ' : ''}${esc(p)} · ${cnt[p]} ${cnt[p] === 1 ? 'тур' : cnt[p] < 5 ? 'тура' : 'туров'}</button>`).join('')}</div>`;
}
function toggleSight(k){ state.sights.has(k) ? state.sights.delete(k) : state.sights.add(k); render(); }

async function renderMapView(){
  if (current) return;
  const cnt = placeCounts();
  const mapped = new Set(PIN_GROUPS.flatMap(g => g.places));
  const lost = Object.keys(cnt).filter(p => !mapped.has(p));
  $('#detail').innerHTML = `<div class="mapview">
    <div class="mh"><b>Карта мест из наших туров.</b> Нажмите на город — он отметится в «Что хочет увидеть» (как кнопки слева), подборка пересчитается. Цифра — сколько туров с открытыми датами туда едут. Откройте тур — карта уступит ему место.</div>
    <div id="cmap" role="region" aria-label="Карта мест туров"></div>
    ${lost.length ? `<div class="mh">Нет на карте: <span class="chips" style="display:inline-flex">${lost.map(p => `<button class="chip ${state.sights.has(p) ? 'on' : ''}" data-set="sights" data-k="${esc(p)}">${esc(p)}</button>`).join('')}</span></div>` : ''}
  </div>`;
  try { await loadLeaflet(); } catch(e){ $('#cmap').innerHTML = '<div class="welcome">Карта не загрузилась — проверьте интернет. Места можно выбрать слева.</div>'; return; }
  if (current || !$('#cmap')) return;
  if (cmap){ cmap.remove(); cmap = null; }
  cmap = L.map('cmap', {scrollWheelZoom:false, zoomSnap:0.25, attributionControl:true});
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
    maxZoom:12, attribution:'Tiles &copy; Esri — Esri, HERE, Garmin, &copy; OpenStreetMap contributors'
  }).addTo(cmap);
  pinMarkers = PIN_GROUPS.filter(g => g.places.some(p => cnt[p])).map(g => {
    const m = L.marker(g.ll, {icon:L.divIcon({className:'', html:pinHtml(g, cnt), iconSize:[14, 14], iconAnchor:[7, 7]}), keyboard:true, title:g.places.join(', ')}).addTo(cmap);
    const live = g.places.filter(p => cnt[p]);
    if (live.length > 1){
      m.bindPopup(() => popupHtml(g, placeCounts()), {closeButton:true, offset:[0, -4]});
      m.on('popupopen', e => e.popup.getElement().addEventListener('click', ev => {
        const b = ev.target.closest('.pchip'); if (!b) return;
        toggleSight(b.dataset.k);
        // правим кнопки на месте: если заменить содержимое, Leaflet сочтёт клик кликом мимо и закроет список
        e.popup.getElement().querySelectorAll('.pchip').forEach(x => {
          const on = state.sights.has(x.dataset.k); x.classList.toggle('on', on);
          x.textContent = (on ? '✓ ' : '') + x.textContent.replace(/^✓ /, '');
        });
      }));
    } else m.on('click', () => toggleSight(live[0]));
    m._g = g; return m;
  });
  cmap.on('zoomend', syncPinLabels);
  fitCMap(); syncPinLabels();
}
function fitCMap(){
  if (!cmap) return;
  cmap.invalidateSize();
  cmap.fitBounds(L.latLngBounds(PIN_GROUPS.map(g => g.ll)), {animate:false, paddingTopLeft:[150, 30], paddingBottomRight:[170, 40]});   // поля под подписи
}
// мелкий масштаб (узкий экран) — подписи только при наведении и у отмеченных, иначе наезжают друг на друга
const syncPinLabels = () => cmap && $('#cmap') && $('#cmap').classList.toggle('small', cmap.getZoom() < 4.7);   // 4.75 (1366 px) — подписи помещаются, 4.5 — уже наезжают
function updatePins(){
  if (!cmap || current || !$('#cmap')) return;
  const cnt = placeCounts();
  // только содержимое значка: setIcon закрыл бы открытый список мест у метки
  pinMarkers.forEach(m => { const el = m.getElement(); if (el) el.innerHTML = pinHtml(m._g, cnt); });
  document.querySelectorAll('.mapview .chips .chip').forEach(c => c.classList.toggle('on', state.sights.has(c.dataset.k)));
}
addEventListener('resize', () => { clearTimeout(fitCMap.t); fitCMap.t = setTimeout(() => { if ($('#cmap')) fitCMap(); }, 200); });

  if(chip){ const set = state[chip.dataset.set], k = chip.dataset.k; set.has(k)?set.delete(k):set.add(k); render(); if(current){ const keep = currentRow && currentRow.open && (!state.months.size || [...currentRow.months].some(m=>state.months.has(m))); if(!keep) currentRow = pickRow(current); renderDetail(true); saveHash(); } return; }  // выбранную вручную дату не сбрасываем, если она подходит
  if(e.target.id==='tomap'){ current = null; currentRow = null; renderResults(); saveHash(); renderMapView(); return; }
  if(e.target.id==='moredates'){ showAllDates=!showAllDates; renderDetail(true); return; }
  if(e.target.id==='moresights'){ showAllSights=!showAllSights; renderFilters(); return; }
  if(e.target.id==='reset'){ SETS.forEach(k=>state[k].clear()); state.q=''; $('#search').value=''; render(); return; }
  const card = e.target.closest('.card');
  if(card){ openTour(TOURS.find(t=>t.key===card.dataset.key)); return; }
  const d = e.target.closest('.date');
  if(d && !d.disabled){ currentRow = current.rows[+d.dataset.i]; renderDetail(true); saveHash(); return; }
  const tb = e.target.closest('.tab');
  if(tb){ tab = tb.dataset.tab; ask = ''; $('#ask').value = ''; renderPane(); return; }   // без перерисовки карточки — прокрутка не прыгает
  const fold = e.target.closest('[data-fold]');
  if(fold){ document.querySelectorAll('#pane details').forEach(d => d.open = fold.dataset.fold==='open'); return; }
  const cp = e.target.closest('[data-copy]');
  if(cp && !cp.disabled){
    const text = copyable(cp.dataset.copy, current, currentRow).text, icon = cp.classList.contains('icopy'), label = cp.innerHTML;
    const ok = () => { if(icon) cp.title='Скопировано'; else cp.textContent='Скопировано ✓'; cp.classList.add('done'); setTimeout(()=>{cp.innerHTML=label;cp.title='Скопировать';cp.classList.remove('done');},1800); };
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(ok).catch(()=>{ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); ok(); });
    return;
  }
  if(e.target.classList.contains('map')){ const z=$('#zoom'); z.querySelector('img').src=e.target.src; z.classList.add('open'); return; }
  if(e.target.closest('#zoom')) $('#zoom').classList.remove('open');
});
// блок «✈ Перелёт»: все поля — выпадающие списки, поэтому перерисовываем блок целиком по change
function onAvia(e){
  const id = e.target.id; if (!id || !id.startsWith('av-') || !current) return;
  const v = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
  if (id === 'av-from') avia.from = v;
  if (id === 'av-back') avia.back = v;
  if (id === 'av-ad') avia.ad = +v;
  if (id === 'av-ch') avia.ch = +v;
  if (id === 'av-early') avia.early = v;
  if (id === 'av-arr' || id === 'av-dep'){ const o = aviaOver[current.key] = aviaOver[current.key] || {}; o[id === 'av-arr' ? 'arr' : 'dep'] = v; }
  saveAvia();
  if ($('#avmini')) $('#avmini').innerHTML = aviaMini(current, currentRow);
}
document.addEventListener('change', onAvia);
document.addEventListener('click', e => {
  if (!e.target.closest('#avmore')) return;
  avia.more = !avia.more; saveAvia();
  $('#avmini').innerHTML = aviaMini(current, currentRow);
});
document.addEventListener('input', e => {
  if(e.target.id==='search'){ state.q = e.target.value.trim(); renderFilters(); renderResults(); saveHash(); }
  if(e.target.id==='ask'){ ask = e.target.value.trim(); renderPane(); }
});
$('#reload').addEventListener('click', () => load());

async function load(){
  $('#status').textContent = 'Загружаю…';
  try{
    const res = await fetch('data.json?_=' + Date.now());
    if(!res.ok) throw new Error(res.status);
    build(await res.json());
  }catch(err){ $('#status').textContent = 'Не удалось загрузить данные'; return; }
  const ageH = (Date.now() - GENERATED) / 36e5, st = $('#status');
  st.textContent = (ageH > 12 ? '⚠︎ Данные устарели: ' : 'Данные с сайта на ') + GENERATED.toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
  st.classList.toggle('stale', ageH > 12);
  readHash();
  renderFilters(); renderResults();
  if(current) renderDetail(); else renderMapView();
}
load();
</script>
