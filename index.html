<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Подборщик туров</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c2412d'/%3E%3Cpath d='M32 12c-8.3 0-15 6.5-15 14.6C17 37.5 32 52 32 52s15-14.5 15-25.4C47 18.5 40.3 12 32 12z' fill='%23fff'/%3E%3Ccircle cx='32' cy='27' r='6' fill='%23c2412d'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f3ee; --panel:#ffffff; --ink:#1f1d1a; --muted:#6f6a62; --line:#e6e0d6;
  --accent:#c2412d; --accent-soft:#fbe9e5; --ok:#2f7d4f; --ok-soft:#e5f3ea; --warn:#9a6a00; --warn-soft:#fbf1d9;
  --chip:#f1ece4; --chip-on:#1f1d1a; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0 6px 0 0;white-space:nowrap}
header h1 span{color:var(--accent)}
.tgl{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px;font-size:13px;white-space:nowrap}
.tgl[aria-pressed="true"]{background:var(--chip-on);color:#fff;border-color:var(--chip-on)}
#search{flex:1;max-width:360px;padding:6px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font:inherit}
#status{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
#status.stale{color:var(--accent);font-weight:600}
main{display:grid;grid-template-columns:250px 290px minmax(0,1fr);min-height:0}
body.no-filters main{grid-template-columns:290px minmax(0,1fr)}
body.no-results main{grid-template-columns:250px minmax(0,1fr)}
body.no-filters.no-results main{grid-template-columns:minmax(0,1fr)}
body.no-filters #filters, body.no-results #results{display:none}
.col{overflow:auto;min-height:0}
#filters{padding:12px 14px;border-right:1px solid var(--line);background:var(--panel)}
#results{padding:12px 10px;border-right:1px solid var(--line)}
#detail{padding:14px 20px 0}
.ftop{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:13px}
.ftop b{font-size:15px}
.link{border:0;background:none;color:var(--accent);padding:2px 0;font-size:12.5px}
.fgroup{margin-bottom:12px}
.fgroup h3{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 5px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:0;background:var(--chip);border-radius:999px;padding:3px 9px;font-size:12.5px}
.chip.on{background:var(--chip-on);color:#fff}
.draft{font-size:10px;color:var(--warn);margin-left:4px;font-weight:400;text-transform:none;letter-spacing:0}
.rhead{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:2px 4px 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin-bottom:7px;cursor:pointer;box-shadow:var(--shadow)}
.card.top{border-color:#e8b9ae}
.card.sel{outline:2px solid var(--accent);outline-offset:-1px}
.card .t{font-weight:600;font-size:13px;line-height:1.3}
.card .m{color:var(--muted);font-size:12px;margin-top:3px}
.card .why{margin-top:5px;display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11px;border-radius:6px;padding:1px 6px;background:var(--ok-soft);color:var(--ok)}
.tag.no{background:var(--chip);color:var(--muted);text-decoration:line-through}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.compact .card{padding:7px 10px;box-shadow:none}
.empty{color:var(--muted);padding:30px 10px;text-align:center}
.welcome{color:var(--muted);max-width:520px;margin:60px auto;text-align:center;line-height:1.6}
/* карточка тура */
.d-top{display:flex;gap:16px;align-items:flex-start}
.d-title{font-size:19px;font-weight:700;line-height:1.25;margin:0}
.d-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:5px;font-size:12.5px;color:var(--muted)}
.d-meta a{color:var(--accent)}
.org{background:var(--chip);color:var(--ink);border-radius:999px;padding:2px 10px}
.d-route{margin-top:5px;font-size:14px;font-weight:600}
.d-route span{color:var(--muted);font-weight:400;margin-right:4px}
.price{margin-left:auto;text-align:right;white-space:nowrap}
.price b{font-size:21px}
.price s{color:var(--muted);margin-left:4px}
.price div{color:var(--muted);font-size:12px}
.note{margin-top:8px;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:5px 10px;font-size:13px}
.dates{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 2px;align-items:center}
.date{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:3px 8px;font-size:12.5px}
.date small{color:var(--muted);margin-left:4px}
.date.match{border-color:var(--ok)}
.date.on{background:var(--chip-on);color:#fff;border-color:var(--chip-on)}
.date.on small{color:#ddd}
.date.full{opacity:.45;text-decoration:line-through;cursor:default}
.more{border:0;background:none;color:var(--accent);font-size:12px;padding:3px 2px}
.cheat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13px;line-height:1.35}
.cell i{display:block;font-style:normal;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:12px;margin-top:10px;align-items:start}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.box h2{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
/* сценарий */
.step{display:grid;grid-template-columns:22px 1fr;gap:4px 8px;padding:7px 0;border-top:1px solid var(--line)}
.step:first-of-type{border-top:0;padding-top:2px}
.step .n{width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.step .h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.step .say{grid-column:2;font-size:14px}
.step ul{margin:3px 0 0;padding-left:17px}
.step li{margin:2px 0}
.step .g{color:var(--ok)}
.step .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.step.close .say{background:var(--accent-soft);border-radius:8px;padding:6px 9px}
.src{color:var(--muted);font-size:11.5px;margin-top:6px}
/* маршрут */
.legs{list-style:none;margin:0;padding:0;font-size:13.5px}
.legs li{display:grid;grid-template-columns:24px 1fr;gap:6px;padding:5px 0;border-top:1px dashed var(--line)}
.legs li:first-child{border-top:0}
.legs .ic{text-align:center}
.legs b{font-weight:600}
.legs small{color:var(--muted)}
.legsum{margin-top:6px;font-size:13px}
.legsum b{color:var(--accent)}
.map{margin-top:8px;width:100%;border-radius:8px;cursor:zoom-in;display:block}
.hint{color:var(--muted);font-size:12px;margin-top:6px}
/* ответы */
.answers{margin-top:12px}
.abar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
#ask{flex:0 1 260px;padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font:inherit;margin-bottom:5px}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tab{border:0;background:none;padding:6px 10px;border-radius:8px 8px 0 0;color:var(--muted);font-size:13px}
.tab.on{background:var(--panel);color:var(--ink);font-weight:600;border:1px solid var(--line);border-bottom-color:var(--panel);margin-bottom:-1px}
/* у всех вкладок одна высота — при переключении страница не прыгает; длинный текст листается внутри */
.pane{background:var(--panel);border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;padding:0 14px 10px;font-size:13.5px;white-space:pre-line;height:clamp(260px,42vh,460px);overflow:auto}
.pane > :first-child:not(.pbar){margin-top:10px}
.pane.rich{white-space:normal}
.obj{border-top:1px solid var(--line);padding:6px 0}
.obj:first-child{border-top:0}
.obj summary{cursor:pointer;font-weight:600}
.obj p{margin:5px 0 2px;white-space:pre-line}
.obj .from{font-size:11px;color:var(--muted);font-weight:400;margin-left:6px}
mark{background:#fff0b3;border-radius:3px}
.msgbar{position:sticky;bottom:0;margin:14px -20px 0;padding:9px 20px;background:var(--panel);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.msgbar .pv{flex:1;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:0;background:var(--accent);color:#fff;border-radius:9px;padding:8px 14px;font-weight:600;white-space:nowrap}
.btn.ghost{background:var(--chip);color:var(--ink);font-weight:500}
.btn.done{background:var(--ok)}
.pbar{position:sticky;top:0;display:flex;align-items:center;gap:10px;padding:8px 0 6px;background:var(--panel);white-space:normal}
.pbar .hint{margin:0;flex:1}
.icopy{border:0;background:none;color:var(--accent);padding:4px;border-radius:6px;display:inline-flex;line-height:0}
.icopy:hover{background:var(--accent-soft)}
.icopy.done{color:var(--ok)}
.ptext{white-space:pre-line}
.ptext a{color:var(--accent);word-break:break-all}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:9;cursor:zoom-out}
.zoom.open{display:flex}
.zoom img{max-width:96vw;max-height:94vh;border-radius:8px}
@media (max-width:1200px){.grid2{grid-template-columns:1fr}.cheat{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>План Мечты · <span>подбор тура</span></h1>
    <button class="tgl" id="tgl-filters" aria-pressed="true" title="Показать / скрыть фильтры">☰ Фильтры</button>
    <button class="tgl" id="tgl-results" aria-pressed="true" title="Показать / скрыть список туров">▤ Подборка</button>
    <input id="search" placeholder="Поиск тура: название, город, организатор">
    <span id="status">Загружаю…</span>
    <button class="tgl" id="reload" title="Перечитать данные (собираются с сайта раз в 4 часа)">Обновить</button>
  </header>
  <main>
    <aside class="col" id="filters"></aside>
    <section class="col" id="results"></section>
    <section class="col" id="detail"><div class="welcome">Отметьте слева, что важно туристу: кто едет, когда, сколько дней, что хочет увидеть.<br>В подборке появятся 1–2 лучших тура — их и предлагайте.</div></section>
  </main>
</div>
<div class="zoom" id="zoom"><img alt="Карта маршрута"></div>
<script src="extra.js"></script>
<script>
// Данные собирает collect.py с сайта planmydream.ru (каталог + страницы туров) в data.json.
const FORMATS = {classic:'Классика и история', nature:'Природа и горы', city:'Мегаполисы', practice:'Практики, ретрит', holiday:'Праздник', beach:'Пляж (опция)'};
const PACES = {calm:'Спокойный', medium:'Средний', active:'Активный'};
const GROUPS = {kids:'С детьми', solo:'Один / одна', senior:'55+'};
const TRANSPORT = {plane:['✈︎','перелёт','перелёта'], train:['🚄','поезд','поезда'], bus:['🚐','на авто','на авто'], night:['🛏','ночной поезд','ночных поезда']};
const SERVICE = /билет|отел|гид|групп|alipay|оплат|страхов|включ|трансфер|завтрак|сопровожд|чат|логистик/i;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today = new Date(); today.setHours(0,0,0,0);
const SOON = 14; // заезды ближе 14 дней по умолчанию не предлагаем — новый клиент не успеет

let TOURS = [], DURS = [], GENERATED = null;
const SETS = ['group','months','dur','sights','pace','formats'];
const state = {months:new Set(), dur:new Set(), sights:new Set(), group:new Set(), formats:new Set(), pace:new Set(), q:''};
let current = null, currentRow = null, tab = 'obj', ask = '', showAllSights = false, showAllDates = false;

const pdate = s => { const m=/(\d{4})-(\d{2})-(\d{2})/.exec(s||''); return m ? new Date(+m[1], m[2]-1, +m[3]) : null; };
const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmtD = d => d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'}).replace('.','');
const fmtLong = d => d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
const monthKey = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const monthName = k => { const [y,m]=k.split('-'); const s=new Date(+y,m-1,1).toLocaleDateString('ru-RU',{month:'long'}); return s[0].toUpperCase()+s.slice(1)+' ’'+y.slice(2); };
const durMin = l => parseInt((l.match(/\d+/)||[99])[0]) - (/^до/i.test(l) ? 100 : 0);
const plural = (n, a, b, c) => { n=Math.abs(n)%100; const k=n%10; return n>10&&n<20 ? c : k===1 ? a : k>=2&&k<=4 ? b : c; };
const dayWord = n => n+' '+plural(n,'день','дня','дней');
const store = (k, v) => { try{ v===undefined ? localStorage.removeItem(k) : localStorage.setItem(k, v); }catch(_){} };
const load_ = k => { try{ return localStorage.getItem(k); }catch(_){ return null; } };

// --- разбор текстов сайта -------------------------------------------------
const bullets = txt => (txt||'').split('\n').map(l=>l.replace(/^•\s*/,'').trim()).filter(l=>l && !/^(Следующие|Также можно)/.test(l));
function short(line, max = 64, withDetail = true, cut = /\s\(|;|\. /){
  let s = line.replace(/\s+/g,' ').trim();
  const c = s.indexOf(':');
  if(c>0 && c<45){ const head = s.slice(0,c).trim(), tail = s.slice(c+1).trim().split(cut)[0]; s = withDetail && tail ? head+' — '+tail : head; }
  else s = s.split(cut)[0];
  if(s.length>max){ s = s.slice(0,max); s = s.slice(0, Math.max(s.lastIndexOf(' '), max-15)).replace(/[,—\-\s]+$/,'')+'…'; }
  return s.replace(/\.$/,'');
}
const lc = s => s ? s[0].toLowerCase()+s.slice(1) : s;
const REFUND = /возврат|отмен|удерж|невыезд/i;  // условия возврата — не схема оплаты
const payLines = t => bullets(t.payment).filter(l=>/%/.test(l) && !REFUND.test(l));
const percents = t => [...new Set((payLines(t).join(' ').match(/\d+\s*%/g)||[]).map(x=>x.replace(/\s/,'')))];
const exclShort = t => { const m = (t.intro||'').match(/Вс[её] включено[^\n.]*/); return m ? m[0].trim() : (bullets(t.excluded).length ? 'Не входит: '+bullets(t.excluded).slice(0,3).map(l=>lc(short(l,40,false))).join(', ') : ''); };

function build(data){
  GENERATED = new Date(data.generatedAt);
  TOURS = data.tours.map(t => {
    const rows = t.departures.map(d => {
      const start = pdate(d.start), end = pdate(d.end), months = new Set();
      for(let x = new Date(start.getFullYear(), start.getMonth(), 1); x <= end; x.setMonth(x.getMonth()+1)) months.add(monthKey(x));
      return {...d, start, end, months, days: Math.round((end-start)/864e5)+1, open: start>=today && d.seats!==0};
    });
    const sights = t.sights.length ? t.sights : t.route.split(/\s+—\s+/);
    const lens = [...new Set(rows.map(r=>r.days))].sort((a,b)=>a-b);
    return {...t, key:t.slug, sights:[...new Set(sights.map(s=>s.trim()).filter(Boolean))], rows, open: rows.filter(r=>r.open),
      lenTxt: lens.length>1 ? lens[0]+'–'+lens[lens.length-1]+' дн.' : (lens[0]||'?')+' дн.',
      minPrice: Math.min(...rows.filter(r=>r.open).map(r=>r.price||Infinity), t.price||Infinity),
      extra: (window.TOUR_EXTRA||{})[t.slug] || {}};
  });
  DURS = [...new Set(TOURS.map(t=>t.duration).filter(Boolean))].sort((a,b)=>durMin(a)-durMin(b));
}

// --- подбор ----------------------------------------------------------------
function score(t){
  const ex = t.extra, reasons = [];
  let s = 0, hard = !t.open.length;
  let dates = t.open;
  if(state.months.size){
    dates = t.open.filter(r => [...r.months].some(m => state.months.has(m)));
    s += dates.length ? 3 : -5;
    reasons.push([dates.length?'ok':'no', dates.length ? 'даты: '+dates.slice(0,2).map(r=>fmtD(r.start)).join(', ') : 'нет дат в эти месяцы']);
  }
  if(state.dur.size){ const ok = state.dur.has(t.duration); s += ok ? 2 : -3; reasons.push([ok?'ok':'no', t.duration.toLowerCase()]); }
  if(state.sights.size){
    const hit = [...state.sights].filter(c => t.sights.includes(c)), miss = [...state.sights].filter(c => !t.sights.includes(c));
    s += hit.length*3 - (hit.length ? 0 : 6);
    hit.forEach(c => reasons.push(['ok', c]));
    if(miss.length) reasons.push(['no', miss.join(', ')]);
  }
  if(state.group.has('kids')){
    if(ex.adultsOnly) hard = true;
    else if(ex.pace==='active'){ s -= 1; reasons.push(['warn','активный темп']); }
  }
  if(state.group.has('senior')){
    if(ex.pace==='active'){ s -= 2; reasons.push(['warn','активный темп']); }
    if(ex.pace==='calm'){ s += 1; reasons.push(['ok','спокойный темп']); }
  }
  if(state.group.has('solo')) reasons.push([t.single||t.roommate?'ok':'warn', t.single ? 'сингл +'+t.single : t.roommate ? 'подселим в пару' : 'сингл: уточнить']);
  if(state.formats.size){
    const hit = (ex.format||[]).filter(f => state.formats.has(f));
    s += hit.length*2 - (hit.length ? 0 : 3);
    hit.forEach(f => reasons.push(['ok', FORMATS[f].toLowerCase()]));
    if(!hit.length) reasons.push(['no', 'другой формат']);
  }
  if(state.pace.size && ex.pace){ const ok = state.pace.has(ex.pace); s += ok?2:-2; reasons.push([ok?'ok':'no', 'темп: '+PACES[ex.pace].toLowerCase()]); }
  if(state.q){
    const hay = (t.title+' '+t.org+' '+t.route+' '+t.sights.join(' ')).toLowerCase();
    if(!state.q.toLowerCase().split(/\s+/).every(w=>hay.includes(w))) hard = true;
  }
  const near = dates[0] ? (dates[0].start - today)/864e5 : 999;
  return {t, s: s - near/1000, hard, reasons, dates};
}
const scored = () => TOURS.map(score).filter(x=>!x.hard).sort((a,b)=>b.s-a.s);
const activeFilters = () => SETS.some(k=>state[k].size);

function renderFilters(){
  const cnt = {};
  TOURS.forEach(t => t.open.length && t.sights.forEach(c => cnt[c]=(cnt[c]||0)+1));
  const sights = Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||a.localeCompare(b));
  const shown = showAllSights ? sights : sights.filter((c,i)=>i<14 || state.sights.has(c));
  const months = [...new Set(TOURS.flatMap(t=>t.open.flatMap(r=>[...r.months])))].sort();
  const chips = (name, items) => items.map(([k,l]) => `<button class="chip ${state[name].has(k)?'on':''}" data-set="${name}" data-k="${esc(k)}">${esc(l)}</button>`).join('');
  const n = scored().length;
  $('#filters').innerHTML = `
    <div class="ftop"><span>Найдено туров: <b>${n}</b></span>${activeFilters()||state.q?'<button class="link" id="reset">Сбросить</button>':''}</div>
    <div class="fgroup"><h3>1 · Кто едет</h3><div class="chips">${chips('group', Object.entries(GROUPS))}</div></div>
    <div class="fgroup"><h3>2 · Когда</h3><div class="chips">${chips('months', months.map(m=>[m,monthName(m)]))}</div></div>

const priceTxt = p => p && isFinite(p) ? '$'+p : 'цена не указана';
function renderResults(){

// --- карточка тура ---------------------------------------------------------
function pickRow(t){
  const sc = score(t), pool = sc.dates.length ? sc.dates : t.open;
  const later = new Date(today); later.setDate(later.getDate()+SOON);
  return pool.find(r=>r.start>=later) || pool[0] || t.rows[0] || null;
}

function routeHTML(t){
  const ex = t.extra;
  if(ex.legs && ex.legs.length){
    const cnt = {}; ex.legs.forEach(l => cnt[l[3]]=(cnt[l[3]]||0)+1);
    const sum = Object.entries(cnt).map(([k,n])=>`${n} ${n>1?TRANSPORT[k][2]:TRANSPORT[k][1]}`).join(', ');
    return `<ul class="legs">
      ${ex.arrive?`<li><span class="ic">🛬</span><span><b>Прилёт:</b> ${esc(ex.arrive)} <small>(международный перелёт — отдельно)</small></span></li>`:''}
      ${ex.legs.map(([d,f,to,tr,time])=>`<li><span class="ic">${TRANSPORT[tr][0]}</span><span><b>День ${d}:</b> ${esc(f)} → ${esc(to)}<br><small>${TRANSPORT[tr][1]} · ${esc(time)}</small></span></li>`).join('')}
      ${ex.depart?`<li><span class="ic">🛫</span><span><b>Вылет домой:</b> город ${esc(ex.depart)}</span></li>`:''}
    </ul>
    <div class="legsum">Переездов внутри Китая: <b>${ex.legs.length}</b> (${sum})</div>
    ${ex.map?`<img class="map" src="${esc(ex.map)}" alt="Карта маршрута" loading="lazy">`:''}`;
  }
  const lines = [];
  t.days.forEach(d => {
    const head = d.split('\n')[0].replace(/\s*\(.*\)$/,'');
    d.split(/\n|(?<=[.!])\s+/).forEach(p => { if(/перел[её]т|поезд|переезд|автобус|трансфер на вокзал/i.test(p) && p.length<220) lines.push([head, p.trim()]); });
  });
  return `<div style="font-weight:600;margin-bottom:4px">${esc(t.route)}</div>
    ${lines.length?`<ul class="legs">${lines.slice(0,8).map(([h,l])=>`<li><span class="ic">${/перел[её]т|аэропорт/i.test(l)?'✈︎':/поезд|вокзал/i.test(l)?'🚄':'🚐'}</span><span><b>${esc(h)}:</b> ${esc(l)}</span></li>`).join('')}</ul>`:''}
    <div class="hint">Точная схема с временем переездов для этого тура ещё не заполнена — показаны фразы о переездах из программы на сайте.</div>`;
}

function benefits(t){
  const items = (t.script||'').split('\n').map(s=>s.trim()).filter(l=>/^[•\-–]/.test(l) && l.includes('→')).map(l=>l.replace(/^[•\-–]\s*/,''));
  const places = items.filter(i=>!SERVICE.test(i.split('→')[0]));
  return (places.length ? places : items).slice(0,3).map(i => { const [p,...g]=i.split('→'); return [short(p,80,true).replace(' — ',': '), g.join('→').trim()]; });
}

function scriptHTML(t, r){
  const tagline = ((t.script||'').match(/«([^»]+)»/)||[])[1];
  const ben = benefits(t);
  const inc = bullets(t.included).slice(0,4).map(l=>short(l,58)), exc = bullets(t.excluded).slice(0,4).map(l=>short(l,48,false));
  const pays = bullets(t.payment).filter(l=>/%|валют|рубл|доллар/i.test(l) && !REFUND.test(l)).slice(0,4).map(l=>short(l,150,true,/\s\(|;/).replace(/^Предоплата \(бронирование\) — Для подтверждения брони требуется предоплата в размере/,'Бронь — предоплата'));
  const prepay = percents(t)[0] || '';
  const near = t.open.filter(x=>x!==r && (!r || +x.start!==+r.start) && Math.abs(x.start-(r?r.start:today))<50*864e5);
  const others = [...near.filter(x=>r&&x.start>r.start), ...near].slice(0,1); // сначала следующий заезд, потом предыдущий
  const steps = [
    ['Предложение', `Под ваши пожелания могу предложить тур «${esc(t.title)}»${r?` — ${dayWord(r.days)}, с ${fmtLong(r.start)} по ${fmtLong(r.end)}`:''}. Маршрут: ${esc(t.route)}.${tagline?`<div class="sub">${esc(tagline)}</div>`:''}`],
    ['Что вас ждёт', ben.length ? `<ul>${ben.map(([p,g])=>`<li>${esc(p)}${g?` → <span class="g">${esc(g)}</span>`:''}</li>`).join('')}</ul>`
      : `Увидите: ${esc(t.sights.slice(0,5).join(', '))}.`],
    ['Что включено / не включено', `В стоимость уже входит:<ul>${inc.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>${exc.length?`<div class="sub">Отдельно оплачиваются: ${esc(exc.map(lc).join('; '))}.</div>`:''}`],
    ['Как вам тур?', 'Как вам в целом тур? Устраивают такие условия?'],
    ['Стоимость', r ? `Стоимость — <b>$${r.price}</b> на человека при двухместном размещении${r.priceOld?` (полная цена $${r.priceOld})`:''}.${t.single?` Одноместный номер — доплата ${esc(t.single)}.`:''}` : 'Ближайших заездов нет.'],
    ['Схема оплаты', pays.length ? `<ul>${pays.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>` : 'Порядок оплаты на странице тура не найден — уточните.'],
    ['Закрывающий вопрос', r ? `${others.length?`Вам удобнее ${fmtLong(r.start)} или ${fmtLong(others[0].start)}? `:''}На ${fmtLong(r.start)} осталось мест: ${r.seats ?? '?'}. Давайте закреплю место за вами?${prepay?` Для брони заключаем договор и вносите ${prepay} от стоимости.`:''}` : ''],
  ];
  return steps.map(([h, say], i) => `<div class="step ${i===3||i===6?'close':''}"><span class="n">${i+1}</span><span class="h">${h}</span><div class="say">${say}</div></div>`).join('')
    + `<div class="src">Шаг 2 — из продающего скрипта в таблице, остальное — с сайта.</div>`;
}

function ctx(t, r){
  const prepay = percents(t)[0];
  return {
    has: re => re.test(t.included), inc: bullets(t.included).slice(0,5).map(l=>lc(short(l,50,false))).join(', '),
    exc: bullets(t.excluded).slice(0,4).map(l=>lc(short(l,40,false))).join(', '),
    prepay: prepay ? prepay+' от стоимости' : 'предоплата', seats: r ? r.seats : null, group: t.group || '15',
    flight: t.flight, single: t.single, roommate: t.roommate,
    scheme: payLines(t).slice(1).map(l=>lc(short(l,220,true,/\s\(|;/))).join('; ') || '',  // первый платёж уже назван
    refund: lc(short(bullets(t.payment).find(l=>REFUND.test(l))||'', 220, true, /;/).replace(/^Условия возврата — /,'')),
    start: t.route.split(/\s+—\s+/)[0], finish: t.route.split(/\s+—\s+/).pop(),
  };
}

function paneHTML(t, r){
  const objs = (window.OBJECTIONS||[]).map(o => ({q:o.q, a:o.a(ctx(t,r)).replace(/…\./g,'…'), from:'возражение'}));
  const faq = t.faq.map(f => ({q:f.q, a:f.a, from:'FAQ сайта'}));
  const item = (o, open) => `<details class="obj" ${open?'open':''}><summary>${hl(o.q)}<span class="from">${o.from}</span></summary><p>${hl(o.a)}</p></details>`;
  if(ask){
    const words = ask.toLowerCase().split(/\s+/).filter(Boolean);
    const hit = s => words.every(w => s.toLowerCase().includes(w));
    const docs = [...objs, ...faq,
      ...bullets(t.included).map(l=>({q:'Включено', a:l, from:'включено'})),
      ...bullets(t.excluded).map(l=>({q:'Не включено', a:l, from:'не включено'})),
      ...bullets(t.payment).map(l=>({q:'Оплата', a:l, from:'оплата'})),
      ...t.days.map(d=>({q:d.split('\n')[0], a:d, from:'программа'}))];
    const found = docs.filter(o => hit(o.q+' '+o.a));
    return {rich:true, html: found.length ? found.slice(0,12).map(o=>item(o,true)).join('') : 'Ничего не нашлось — попробуйте другое слово.'};
  }
  if(tab==='obj') return {rich:true, html:`<div class="hint" style="margin:0 0 4px">Цифры и состав подставлены со страницы тура. <span class="draft">черновик — проверьте формулировки</span></div>`+objs.map(o=>item(o)).join('')};
  if(tab==='faq') return {rich:true, html: faq.map(o=>item(o)).join('') || '—'};
  const c = copyable(tab, t, r);
  const linkify = h => h.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  return {rich:true, html:`<div class="pbar"><span class="hint">${esc(c.note)}</span><button class="icopy" data-copy="${tab}" title="Скопировать" aria-label="Скопировать"><svg viewBox='0 0 24 24' width='18' height='18' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><rect x='9' y='9' width='12' height='12' rx='2'/><path d='M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1'/></svg></button></div><div class="ptext">${linkify(esc(c.text || '— не найдено'))}</div>`};
}
// Текст вкладки — он же копируется кнопкой. note — откуда данные.
function copyable(k, t, r){
  if(k==='inc') return {text:t.included, note:'Что включено — со страницы тура'};
  if(k==='exc') return {text:t.excluded, note:'Что не включено — со страницы тура'};
  if(k==='pay') return {text:t.payment+(t.extras?'\n\nДополнительные услуги:\n'+t.extras:''), note:'Порядок оплаты — со страницы тура'};
  if(k==='prog'){ const c = contractText(t, r); return {text:c.text, note: c.contract ? 'Как в договоре (из таблицы)'+(c.redated?', даты пересчитаны под выбранный заезд':'') : 'В таблице нет расписания «как в договоре» — программа с сайта'}; }
  if(k==='msg') return r ? {text:r.message, note:`Для заезда ${fmtD(r.start)}–${fmtD(r.end)}, данные — с сайта`} : {text:'', note:'Нет открытых дат'};
  if(k==='hotels'){
    const list = t.hotelsSheet || [], key = r ? iso(r.start)+'_'+iso(r.end) : '';
    const h = list.find(x => x.start+'_'+x.end === key) || list[0];
    const sheet = h && !/^Нет данных/i.test(h.text) ? h.text : '';
    return {text:[sheet, t.hotels ? (sheet ? 'С сайта: ' : '')+t.hotels : ''].filter(Boolean).join('\n\n'),
      note: sheet ? 'Отели — из таблицы (на сайте названий нет)' : 'В таблице отелей нет — описание с сайта'};
  }
  return {text:'', note:''};
}
function hl(s){
  let h = esc(s);
  if(ask) ask.split(/\s+/).filter(w=>w.length>1).forEach(w => { h = h.replace(new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'), '<mark>$1</mark>'); });
  return h;
}
const TABS = {obj:'Возражения', faq:'FAQ с сайта', inc:'Включено', exc:'Не включено', pay:'Оплата', prog:'Программа по дням', msg:'Сообщение туристу', hotels:'Проживание'};

// Программа «как в договоре» — из таблицы. Если для выбранного заезда её нет, берём расписание
// другого заезда этого тура и пересчитываем даты в заголовках «День N (дд.мм)».
function contractText(t, r){
  const list = t.contract || [];
  if(!list.length) return {text: t.days.join('\n\n'), contract:false};
  const key = r ? iso(r.start)+'_'+iso(r.end) : '';
  const exact = list.find(c => c.start+'_'+c.end === key);
  if(exact || !r) return {text: (exact||list[0]).text, contract:true};
  const same = list.find(c => pdate(c.end) && Math.round((pdate(c.end)-pdate(c.start))/864e5)+1 === r.days) || list[0];
  const dd = n => { const x = new Date(r.start); x.setDate(x.getDate()+n-1); return String(x.getDate()).padStart(2,'0')+'.'+String(x.getMonth()+1).padStart(2,'0'); };
  const text = same.text.replace(/((?:День|Дни)\s*)(\d+)(?:\s*[–-]\s*(\d+))?\s*\([^)]*\)/g, (m, w, a, b) => `${w}${a}${b?'–'+b:''} (${dd(+a)}${b?'–'+dd(+b):''})`);
  return {text, contract:true, redated:true};
}
function renderPane(){

  const pane = $('#pane'); pane.className = 'pane'+(p.rich?' rich':''); pane.innerHTML = p.html;
}

// --- адрес страницы: подборку можно обновить или отправить ссылкой --------
function saveHash(){
  const p = new URLSearchParams();
  SETS.forEach(k => state[k].size && p.set(k, [...state[k]].join('|')));
  if(state.q) p.set('q', state.q);
  if(current) p.set('t', current.key);
  if(current && currentRow) p.set('d', iso(currentRow.start)+'_'+iso(currentRow.end));
  history.replaceState(null, '', '#'+p.toString());
}
function readHash(){
  const p = new URLSearchParams(location.hash.slice(1));
  SETS.forEach(k => { state[k] = new Set((p.get(k)||'').split('|').filter(Boolean)); });
  state.q = p.get('q')||''; $('#search').value = state.q;
  current = TOURS.find(t=>t.key===p.get('t')) || null;
  currentRow = null;
  if(current){ const d = p.get('d'); currentRow = (d && current.rows.find(r=>iso(r.start)+'_'+iso(r.end)===d && r.open)) || pickRow(current); }
}

function render(){ renderFilters(); renderResults(); saveHash(); }
function openTour(t){ current = t; currentRow = pickRow(t); showAllDates = false; renderResults(); renderDetail(); saveHash(); }

}

document.addEventListener('click', e => {

  if(chip){ const set = state[chip.dataset.set], k = chip.dataset.k; set.has(k)?set.delete(k):set.add(k); render(); if(current){ const keep = currentRow && currentRow.open && (!state.months.size || [...currentRow.months].some(m=>state.months.has(m))); if(!keep) currentRow = pickRow(current); renderDetail(true); saveHash(); } return; }  // выбранную вручную дату не сбрасываем, если она подходит
  if(e.target.id==='moredates'){ showAllDates=!showAllDates; renderDetail(true); return; }
  if(e.target.id==='moresights'){ showAllSights=!showAllSights; renderFilters(); return; }
  if(e.target.id==='reset'){ SETS.forEach(k=>state[k].clear()); state.q=''; $('#search').value=''; render(); return; }
  const card = e.target.closest('.card');
  if(card){ openTour(TOURS.find(t=>t.key===card.dataset.key)); return; }
  const d = e.target.closest('.date');
  if(d && !d.disabled){ currentRow = current.rows[+d.dataset.i]; renderDetail(true); saveHash(); return; }
  const tb = e.target.closest('.tab');
  if(tb){ tab = tb.dataset.tab; ask = ''; $('#ask').value = ''; renderPane(); return; }   // без перерисовки карточки — прокрутка не прыгает
  const cp = e.target.closest('[data-copy]');
  if(cp && !cp.disabled){
    const text = copyable(cp.dataset.copy, current, currentRow).text, icon = cp.classList.contains('icopy'), label = cp.innerHTML;
    const ok = () => { if(icon) cp.title='Скопировано'; else cp.textContent='Скопировано ✓'; cp.classList.add('done'); setTimeout(()=>{cp.innerHTML=label;cp.title='Скопировать';cp.classList.remove('done');},1800); };
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(ok).catch(()=>{ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); ok(); });
    return;
  }
  if(e.target.classList.contains('map')){ const z=$('#zoom'); z.querySelector('img').src=e.target.src; z.classList.add('open'); return; }
  if(e.target.closest('#zoom')) $('#zoom').classList.remove('open');
});
document.addEventListener('input', e => {
  if(e.target.id==='search'){ state.q = e.target.value.trim(); renderFilters(); renderResults(); saveHash(); }
  if(e.target.id==='ask'){ ask = e.target.value.trim(); renderPane(); }
});
$('#reload').addEventListener('click', () => load());

async function load(){
  $('#status').textContent = 'Загружаю…';
  try{
    const res = await fetch('data.json?_=' + Date.now());
    if(!res.ok) throw new Error(res.status);
    build(await res.json());
  }catch(err){ $('#status').textContent = 'Не удалось загрузить данные'; return; }
  const ageH = (Date.now() - GENERATED) / 36e5, st = $('#status');
  st.textContent = (ageH > 12 ? '⚠︎ Данные устарели: ' : 'Данные с сайта на ') + GENERATED.toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
  st.classList.toggle('stale', ageH > 12);
  readHash();
  renderFilters(); renderResults();
  if(current) renderDetail();
}
load();
</script>
