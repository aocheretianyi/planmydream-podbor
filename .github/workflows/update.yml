# Раз в 4 часа собирает данные туров с planmydream.ru, дописывает новые туры через Claude и выкладывает подборщик на GitHub Pages.
name: Обновить данные и выложить

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Установить библиотеку Claude
        run: pip install --quiet anthropic
      - name: Собрать данные с сайта (новые туры дописывает Claude)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 collect.py
      - name: Сохранить data.json и auto.json, если изменились
        run: |
          if ! git diff --quiet -- data.json auto.json; then
            git config user.name "podbor-bot"
            git config user.email "podbor-bot@users.noreply.github.com"
            git add data.json auto.json
            git commit -m "Данные с сайта: $(date -u +'%Y-%m-%d %H:%M') UTC"
            # auto.json важно сохранить (иначе Claude будет вызываться повторно); при параллельном запуске — подтянуть и повторить
            git push || (git pull --rebase -X theirs && git push) || echo "не сохранено в истории (параллельный запуск), выкладка продолжается"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
