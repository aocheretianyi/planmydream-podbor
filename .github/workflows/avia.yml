# Раз в день (~06:20 МСК) обновляет avia_prices.json — цены билетов (кэш Aviasales через Travelpayouts) на даты наших туров
# из основных городов России. Токен — секрет TRAVELPAYOUTS_TOKEN. Потом запускает выкладку сайта.
name: Билеты — обновить цены

on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: avia
  cancel-in-progress: false

jobs:
  avia:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Собрать цены
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: python3 avia_prices.py
      - name: Сохранить, если изменилось, и выложить сайт
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain avia_prices.json)" ]; then
            git config user.name "podbor-bot"
            git config user.email "podbor-bot@users.noreply.github.com"
            git add avia_prices.json
            git commit -m "Цены билетов $(date -u +'%Y-%m-%d') UTC"
            git push || (git pull --rebase -X theirs && git push)
            gh workflow run update.yml
          fi
